document.getElementById('prev-week').onclick=()=>{if(currentWeek===1){currentYear--;currentWeek=getISOWeeksInYear(currentYear);}else currentWeek--;render();};
document.getElementById('next-week').onclick=()=>{if(currentWeek===getISOWeeksInYear(currentYear)){currentWeek=1;currentYear++;}else currentWeek++;render();};
document.getElementById('btn-current').onclick=()=>{const w=getISOWeek(new Date());currentWeek=w.week;currentYear=w.year;render();};
document.getElementById('btn-next').onclick=()=>{const w=getISOWeek(new Date());const max=getISOWeeksInYear(w.year);currentWeek=w.week===max?1:w.week+1;currentYear=w.week===max?w.year+1:w.year;render();};

// ─── MODAL ───────────────────────────────────────────────────────────────────
let baseServings=4,currentServings=4,currentRecipe=null,currentModalName='';

function switchTab(tab){
  document.querySelectorAll('.modal-tab').forEach((t,i)=>{t.classList.toggle('active',(i===0&&tab==='recept')||(i===1&&tab==='betyg'));});
  document.getElementById('pane-recept').classList.toggle('active',tab==='recept');
  document.getElementById('pane-betyg').classList.toggle('active',tab==='betyg');
}

function openModal(name,icon,meta){
  const r=recipes[name];
  currentModalName=name;currentRecipe=r||null;
  document.getElementById('m-icon').textContent=icon;
  document.getElementById('m-title').textContent=name;
  document.getElementById('m-meta').textContent=meta;
  if(r){baseServings=r.servings;currentServings=r.servings;document.getElementById('srv-count').textContent=currentServings;renderIngredients();renderSteps(r.steps);}
  else{document.getElementById('m-ingredients').innerHTML='<li class="ing-row"><span class="ing-name-text" style="color:var(--muted);font-style:italic">Recept läggs till snart</span></li>';document.getElementById('m-steps').innerHTML='';}
  renderRatings(name);selectedRating=0;
  document.querySelectorAll('.star-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('rating-status').textContent='';
  switchTab('recept');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function renderIngredients(){
  if(!currentRecipe)return;
  const addedSet=new Set(shopItems.map(i=>i.text.toLowerCase()));
  document.getElementById('m-ingredients').innerHTML=currentRecipe.ingredients.map(([name,qty])=>{
    if(qty==='')return`<li class="ing-row section-header"><span>${name}</span></li>`;
    const scaledQty=scaleQty(qty,baseServings,currentServings);
    const isAdded=addedSet.has(name.toLowerCase());
    const chkClass='ing-check'+(isAdded?' checked':'');
    const chkMark=isAdded?'✓':'';
    return`<li class="ing-row" onclick="toggleIngCheck(this,'${name.replace(/'/g,"\\'")}','${scaledQty.replace(/'/g,"\\'")}')">
      <div class="ing-left">
        <div class="${chkClass}">${chkMark}</div>
        <span class="ing-name-text">${name}</span>
      </div>
      <span class="ing-qty">${scaledQty}</span>
    </li>`;
  }).join('');
}

async function toggleIngCheck(row,name,qty){
  const check=row.querySelector('.ing-check');
  const already=check.classList.contains('checked');
  if(already){
    check.classList.remove('checked');check.textContent='';
    const del=shopItems.find(i=>i.text.toLowerCase()===name.toLowerCase());
    shopItems=shopItems.filter(i=>i.text.toLowerCase()!==name.toLowerCase());
    if(del)try{await fetch(API,{method:'POST',body:JSON.stringify({action:'deleteShopItem',id:del.id})});}catch(e){}
    updateBadge();renderShopList();
  }else{
    check.classList.add('checked');check.textContent='✓';
    addToShop(name,qty);
  }
}

function scaleQty(qty,base,target){
  if(base===target)return qty;
  const f=target/base;
  return qty.replace(/(\d+[,.]?\d*)/g,m=>{
    const n=parseFloat(m.replace(',','.'))*f;
    const r=Math.round(n*4)/4;
    return r===Math.floor(r)?r.toString():r.toFixed(1).replace('.',',');
  });
}
function renderSteps(steps){document.getElementById('m-steps').innerHTML=steps.map((s,i)=>`<li><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('');}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}
document.getElementById('modal-close').onclick=closeModal;
document.getElementById('overlay').onclick=e=>{if(e.target===document.getElementById('overlay'))closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSwap();}});
document.getElementById('srv-up').onclick=()=>{currentServings+=2;document.getElementById('srv-count').textContent=currentServings;renderIngredients();};
document.getElementById('srv-down').onclick=()=>{if(currentServings>2){currentServings-=2;document.getElementById('srv-count').textContent=currentServings;renderIngredients();}};

// ─── RATING ──────────────────────────────────────────────────────────────────
let selectedRating=0;
const starsRow=document.getElementById('stars-row');
for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='star-btn';b.textContent=i;b.onclick=()=>{selectedRating=i;document.querySelectorAll('.star-btn').forEach((btn,idx)=>btn.classList.toggle('sel',idx<i));};starsRow.appendChild(b);}

function renderRatings(name){
  const rs=ratingsCache[name];
  const el=document.getElementById('ratings-list');
  if(!rs||!rs.length){el.innerHTML='<p class="no-ratings">Inga betyg ännu</p>';return;}
  el.innerHTML='<div class="ratings-list">'+rs.map(r=>`<div class="rating-entry"><div><div style="font-weight:500">${r.namn}</div><div class="rating-meta">${r.tidpunkt}</div></div><div class="rating-score">${r.betyg}/10</div></div>`).join('')+'</div>';
}
async function submitRating(){
  const namn=document.getElementById('rating-name').value.trim();
  if(!namn){document.getElementById('rating-status').textContent='Ange ditt namn.';return;}
  if(!selectedRating){document.getElementById('rating-status').textContent='Välj ett betyg 1–10.';return;}
  const btn=document.getElementById('submit-rating');btn.disabled=true;
  document.getElementById('rating-status').textContent='Sparar...';
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'saveRating',ratt:currentModalName,namn,betyg:selectedRating})});
    if(!ratingsCache[currentModalName])ratingsCache[currentModalName]=[];
    ratingsCache[currentModalName].push({namn,betyg:selectedRating,tidpunkt:new Date().toLocaleString('sv-SE')});
    renderRatings(currentModalName);
    document.getElementById('rating-status').textContent='✓ Betyg sparat!';
    selectedRating=0;document.querySelectorAll('.star-btn').forEach(b=>b.classList.remove('sel'));
    render();
  }catch(e){document.getElementById('rating-status').textContent='Kunde inte spara, försök igen.';}
  btn.disabled=false;
}

// ─── SWAP ────────────────────────────────────────────────────────────────────
let swapTarget={name:'',typ:'',pos:0};

function openSwap(name,typ,pos){
  swapTarget={name,typ,pos};
  document.getElementById('swap-current-name').textContent=name;
  document.getElementById('ai-loading').style.display='none';
  showCuisineList();
  document.getElementById('swap-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSwap(){document.getElementById('swap-overlay').classList.remove('open');if(!document.getElementById('overlay').classList.contains('open'))document.body.style.overflow='';}
document.getElementById('swap-overlay').onclick=e=>{if(e.target===document.getElementById('swap-overlay'))closeSwap();};

function showCuisineList(){
  document.getElementById('swap-view-cuisines').style.display='block';
  document.getElementById('swap-view-recipes').style.display='none';
  // Bygg karta: kök → recept (exkl. nuvarande rätt)
  const map={};
  mealPool.forEach(m=>{
    if(m.n===swapTarget.name)return;
    const k=m.k||'Övrigt';
    if(!map[k])map[k]=[];
    map[k].push(m);
  });
  const cuisines=Object.keys(map).sort((a,b)=>a.localeCompare(b,'sv'));
  const el=document.getElementById('swap-cuisine-list');
  el.innerHTML=cuisines.map(c=>`<button class="cuisine-row" onclick="showRecipesForCuisine('${c.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"><span class="cuisine-row-name">${c}</span><span class="cuisine-row-count">${map[c].length}</span></button>`).join('');
}

function showRecipesForCuisine(cuisine){
  document.getElementById('swap-view-cuisines').style.display='none';
  document.getElementById('swap-view-recipes').style.display='block';
  document.getElementById('swap-cuisine-title').textContent=cuisine;
  const options=mealPool.filter(m=>m.n!==swapTarget.name&&(m.k||'Övrigt')===cuisine);
  const el=document.getElementById('swap-options');
  if(!options.length){el.innerHTML='<p style="font-size:13px;color:var(--muted);font-style:italic">Inga rätter</p>';return;}
  el.innerHTML=options.map(m=>`<button class="swap-option" onclick="applySwap('${m.n.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"><div class="swap-option-name">${m.i} ${m.n}</div><div class="swap-option-desc">${m.d}</div></button>`).join('');
}

function randomSwap(){const options=mealPool.filter(m=>m.n!==swapTarget.name);applySwap(options[Math.floor(Math.random()*options.length)].n);}
async function applySwap(newName){
  const{typ,pos}=swapTarget;const key=`${currentWeek}_${currentYear}`;
  if(!mealsCache[key])mealsCache[key]={big:[null,null],small:[null,null]};
  mealsCache[key][typ][pos]=newName;
  try{await fetch(API,{method:'POST',body:JSON.stringify({action:'saveMeal',vecka:currentWeek,ar:currentYear,typ,position:pos,ratt:newName})});}catch(e){console.warn('save meal',e);}
  closeSwap();render();
}
async function aiSwap(){
  const loading=document.getElementById('ai-loading');loading.style.display='block';loading.textContent='Genererar recept med AI...';
  const currentM=mealPool.find(m=>m.n===swapTarget.name);const tags=currentM?currentM.t.join(', '):'';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:'Du är en kock som skapar svenska matrecept. Svara ENBART med JSON, inget annat. Ingen markdown, inga backticks.',messages:[{role:'user',content:`Skapa ett nytt matrecept som liknar kategorin: ${tags}. Recept som ska bytas ut: ${swapTarget.name}. Svara med JSON: {"name":"Receptnamnet","desc":"Kort beskrivning max 15 ord","icon":"🍽️","ingredients":[["ingrediens","mängd"]],"steps":["steg 1","steg 2"]}`}]})});
    if(!resp.ok)throw new Error(`API-fel: ${resp.status}`);
    const data=await resp.json();
    if(!data.content||!data.content[0]||!data.content[0].text)throw new Error('Tomt svar från API');
    const recipe=JSON.parse(data.content[0].text.trim());
    const newMeal={n:recipe.name,d:recipe.desc,t:currentM?currentM.t:['grön'],i:recipe.icon||'🍽️'};
    mealPool.push(newMeal);recipes[recipe.name]={servings:4,ingredients:recipe.ingredients,steps:recipe.steps};
    loading.style.display='none';applySwap(recipe.name);
  }catch(e){loading.textContent='Kunde inte generera recept just nu.';console.error(e);}
}

// ─── ADD RECIPE ──────────────────────────────────────────────────────────────
function openAddRecipe(){
  document.getElementById('add-recipe-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  // Reset form
  ['ar-name','ar-desc','ar-icon'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ar-servings').value=4;
  document.getElementById('ar-cuisine').value='';
  document.getElementById('ar-status').textContent='';
  document.querySelectorAll('.tag-toggle').forEach(b=>b.classList.remove('on'));
  document.getElementById('ar-ing-list').innerHTML='';
  document.getElementById('ar-step-list').innerHTML='';
  addArIng(); addArIng(); addArIng(); // start with 3 ingredient rows
  addArStep(); addArStep(); // start with 2 step rows
}
function closeAddRecipe(){
  document.getElementById('add-recipe-overlay').classList.remove('open');
  document.body.style.overflow='';
}
function toggleArTag(btn){btn.classList.toggle('on');}
function addArIng(){
  const list=document.getElementById('ar-ing-list');
  const div=document.createElement('div');
  div.className='ing-entry';
  div.innerHTML=`<input class="ar-input ing-name-f" placeholder="Ingrediens" type="text">
    <input class="ar-input ing-qty-f" placeholder="Mängd" type="text">
    <button class="ing-del-btn" onclick="this.parentElement.remove()">×</button>`;
  list.appendChild(div);
  div.querySelector('input').focus();
}
function addArStep(){
  const list=document.getElementById('ar-step-list');
  const idx=list.children.length+1;
  const div=document.createElement('div');
  div.className='ing-entry';
  div.style.alignItems='flex-start';
  div.innerHTML=`<span style="min-width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--cream);font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;margin-top:6px;flex-shrink:0">${idx}</span>
    <textarea class="ar-input" placeholder="Beskriv steget..." rows="2" style="resize:vertical;flex:1"></textarea>
    <button class="ing-del-btn" style="margin-top:6px" onclick="this.parentElement.remove();reindexSteps()">×</button>`;
  list.appendChild(div);
}
function reindexSteps(){
  document.querySelectorAll('#ar-step-list .ing-entry span').forEach((s,i)=>s.textContent=i+1);
}
async function saveArRecipe(){
  const name=document.getElementById('ar-name').value.trim();
  const desc=document.getElementById('ar-desc').value.trim();
  const icon=document.getElementById('ar-icon').value.trim()||'🍽️';
  const servings=parseInt(document.getElementById('ar-servings').value)||4;
  const cuisine=document.getElementById('ar-cuisine').value;
  const tags=[...document.querySelectorAll('.tag-toggle.on')].map(b=>b.dataset.tag);
  const status=document.getElementById('ar-status');

  if(!name){status.style.color='var(--red)';status.textContent='Ange ett receptnamn.';return;}
  if(!desc){status.style.color='var(--red)';status.textContent='Lägg till en kort beskrivning.';return;}

  const ingRows=[...document.querySelectorAll('#ar-ing-list .ing-entry')];
  const ingredients=ingRows
    .map(r=>[r.querySelectorAll('input')[0].value.trim(), r.querySelectorAll('input')[1].value.trim()])
    .filter(([n])=>n);

  const stepRows=[...document.querySelectorAll('#ar-step-list .ing-entry textarea')];
  const steps=stepRows.map(t=>t.value.trim()).filter(Boolean);

  if(!ingredients.length){status.style.color='var(--red)';status.textContent='Lägg till minst en ingrediens.';return;}
  if(!steps.length){status.style.color='var(--red)';status.textContent='Lägg till minst ett steg.';return;}

  const btn=document.querySelector('.ar-save-btn');
  btn.disabled=true;
  status.style.color='var(--muted)';
  status.textContent='Sparar…';

  try{
    await fetch(API,{method:'POST',body:JSON.stringify({
      action:'saveCustomRecipe',
      namn:name, beskrivning:desc, icon, portioner:servings,
      kok:cuisine, taggar:tags, ingredienser:ingredients, steg:steps
    })});
    // Add locally too so it's immediately available
    const existing=mealPool.findIndex(m=>m.n===name);
    const entry={n:name,d:desc,t:tags,k:cuisine,i:icon,custom:true};
    if(existing>=0)mealPool[existing]=entry; else mealPool.push(entry);
    recipes[name]={servings,ingredients,steps};
    status.style.color='var(--green)';
    status.textContent=`✓ "${name}" sparat!`;
    setTimeout(closeAddRecipe,1200);
  }catch(err){
    status.style.color='var(--red)';
    status.textContent='Kunde inte spara – kontrollera anslutningen.';
  }finally{btn.disabled=false;}
}
document.getElementById('add-recipe-overlay').addEventListener('click',function(e){if(e.target===this)closeAddRecipe();});


init();
</script>
