<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maten</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7F4EF;--ink:#1C1917;--muted:#6B6560;--green:#2D6A4F;--green-light:#D8F3DC;--blue:#1D5A8A;--blue-light:#DBE9F4;--amber:#92400E;--amber-light:#FEF3C7;--red:#9B2335;--red-light:#FDE8EB;--border:rgba(28,25,23,0.12)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh}
header{background:var(--ink);color:var(--cream);padding:1.5rem 1.25rem 1rem}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:600;margin-bottom:0.15rem}
.header-sub{color:rgba(247,244,239,0.45);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase}
.top-tabs{background:var(--ink);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:40;display:flex;overflow-x:auto}
.ttab{padding:0.55rem 1.1rem;font-size:13px;color:rgba(247,244,239,0.45);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.ttab:hover{color:rgba(247,244,239,0.85)}
.ttab.active{color:var(--cream);border-bottom-color:var(--cream)}
.week-nav{background:var(--cream);border-bottom:1px solid var(--border);padding:0.5rem 1.25rem;position:sticky;top:37px;z-index:30;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk-label{font-size:0.82rem;min-width:140px}
.wk-btn{padding:3px 11px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;font-size:11px;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.15s}
.wk-btn:hover,.wk-btn.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.wk-arrow{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;color:var(--muted)}
.wk-arrow:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.sep{width:1px;height:16px;background:var(--border);margin:0 2px}
main{max-width:900px;margin:0 auto;padding:1.25rem 1.25rem 6rem}
.page{display:none}
.page.active{display:block}
.sec-head{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin:0 0 0.6rem;display:flex;align-items:center;gap:8px}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-block{margin-bottom:1.5rem}
.meal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.meal-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;transition:all 0.2s;position:relative;user-select:none}
.meal-card:hover{box-shadow:0 4px 16px rgba(28,25,23,0.1);border-color:rgba(28,25,23,0.2);transform:translateY(-1px)}
.meal-card:active{transform:translateY(0)}
.badge-big{display:inline-block;font-size:9px;letter-spacing:0.07em;text-transform:uppercase;background:var(--amber-light);color:var(--amber);padding:2px 8px;border-radius:99px;margin-bottom:6px}
.card-name{font-weight:500;font-size:0.95rem;margin-bottom:4px;line-height:1.3}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:9px;padding:2px 7px;border-radius:99px;background:var(--green-light);color:var(--green)}
.tag.kott{background:var(--red-light);color:var(--red)}
.tag.fisk{background:var(--blue-light);color:var(--blue)}
.tag.potatis{background:var(--amber-light);color:var(--amber)}
.tag.gron{background:var(--green-light);color:var(--green)}
.tag.baljvaxter{background:#EDE9FE;color:#4C3A8B}
.tag.matlada{background:#F3F4F6;color:#374151}
.card-portions{display:flex;align-items:center;gap:6px;margin-top:6px;border-top:1px solid var(--border);padding-top:8px}
.card-portions label{font-size:10px;color:var(--muted);flex:1}
.port-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;color:var(--muted)}
.port-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.port-num{font-size:13px;font-weight:500;min-width:20px;text-align:center}
.swap-btn{margin-top:8px;width:100%;padding:6px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.15s}
.swap-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.card-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:6px;opacity:0.6}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-chip{padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.15s}
.filter-chip:hover,.filter-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.filter-chip.add-chip{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.search-box{padding:5px 12px;border-radius:99px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;background:white;width:100%;max-width:280px;outline:none}
.search-box:focus{border-color:var(--ink)}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.recipe-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:0.85rem;cursor:pointer;transition:all 0.2s}
.recipe-card:hover{box-shadow:0 4px 12px rgba(28,25,23,0.08);transform:translateY(-1px)}
.rc-plan-btn{margin-top:6px;width:100%;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;font-size:10px;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.15s;text-align:center}
.rc-plan-btn:hover{background:var(--green-light);color:var(--green);border-color:var(--green)}
.rc-plan-btn.on-plan{background:var(--green-light);color:var(--green);border-color:var(--green)}
.rc-name{font-weight:500;font-size:0.88rem;margin-bottom:3px}
.rc-cuisine{font-size:10px;color:var(--muted)}
.rc-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.shop-input-row{display:flex;gap:8px;margin-bottom:1rem}
.shop-input{flex:1;padding:8px 14px;border-radius:99px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;background:white;outline:none}
.shop-input:focus{border-color:var(--ink)}
.shop-add-btn{padding:8px 18px;border-radius:99px;background:var(--ink);color:var(--cream);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px}
.shop-actions{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.shop-act-btn{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.15s}
.shop-act-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;transition:all 0.15s}
.shop-item.done{opacity:0.45}
.shop-item.done .shop-name{text-decoration:line-through}
.shop-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;font-size:10px}
.shop-item.done .shop-check{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.shop-name{flex:1;font-size:14px}
.shop-del{width:22px;height:22px;border-radius:50%;border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;opacity:0.5;transition:all 0.15s}
.shop-del:hover{opacity:1;color:var(--red)}
.fab{position:fixed;bottom:1.5rem;right:1.5rem;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--cream);border:none;cursor:pointer;font-size:22px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(28,25,23,0.25);z-index:50;transition:all 0.2s}
.fab:hover{transform:scale(1.08)}
.fab.visible{display:flex}
.overlay{position:fixed;inset:0;background:rgba(28,25,23,0.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:90vh;overflow-y:auto;padding:1.5rem}
@media(min-width:600px){.modal{border-radius:16px;max-height:80vh}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.modal-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:600;line-height:1.2}
.modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.modal-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem}
.mtab{padding:8px 16px;font-size:13px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.mtab.active{color:var(--ink);border-bottom-color:var(--ink)}
.ing-list{list-style:none;margin-bottom:1rem}
.ing-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer;transition:all 0.15s}
.ing-row.checked{text-decoration:line-through;opacity:0.45}
.ing-row .qty{color:var(--muted);font-size:12px}
.steps-list{counter-reset:step;list-style:none}
.step-item{counter-increment:step;padding:10px 0 10px 2.2rem;position:relative;border-bottom:1px solid var(--border);font-size:14px;line-height:1.5}
.step-item::before{content:counter(step);position:absolute;left:0;top:10px;width:22px;height:22px;background:var(--ink);color:var(--cream);border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center}
.srv-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.srv-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.srv-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.srv-count{font-weight:500;font-size:15px;min-width:20px;text-align:center}
.srv-label{font-size:13px;color:var(--muted)}
.no-recipe{color:var(--muted);font-size:14px;padding:1rem 0}
.stars-row{display:flex;gap:4px;flex-wrap:wrap;margin:0.75rem 0}
.star-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all 0.15s;color:var(--muted)}
.star-btn.sel{background:var(--amber);color:white;border-color:var(--amber)}
.save-rating-btn{padding:8px 20px;border-radius:99px;background:var(--green);color:white;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px}
.modal-del-btn{margin-top:1rem;width:100%;padding:10px;border-radius:10px;border:1px solid var(--red);background:none;color:var(--red);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;transition:all 0.15s}
.modal-del-btn:hover{background:var(--red);color:white}
.avg-rating{font-size:12px;color:var(--amber);margin-top:4px}
.swap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:50vh;overflow-y:auto}
.swap-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:0.75rem;cursor:pointer;transition:all 0.15s}
.swap-card:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.swap-card-name{font-size:13px;font-weight:500}
.swap-card-kok{font-size:11px;opacity:0.6;margin-top:2px}
.swap-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem}
.form-group{margin-bottom:1rem}
.form-label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.form-input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;background:white;outline:none}
.form-input:focus{border-color:var(--ink)}
.form-textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;background:white;outline:none;resize:vertical;min-height:70px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag-toggle{padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.15s}
.tag-toggle.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.ing-editor{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px}
.ing-editor-row{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center}
.ing-editor-row:last-child{border-bottom:none}
.ie-name{flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.ie-qty{width:80px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.ie-del{width:20px;height:20px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px}
.steps-editor{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px}
.step-editor-row{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center}
.step-editor-row:last-child{border-bottom:none}
.se-num{font-size:11px;color:var(--muted);min-width:20px}
.se-text{flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.add-row-btn{font-size:12px;color:var(--muted);background:none;border:1px dashed var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.add-row-btn:hover{border-color:var(--ink);color:var(--ink)}
.save-btn{width:100%;padding:12px;border-radius:10px;background:var(--ink);color:var(--cream);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15px;margin-top:0.5rem}
@media(max-width:480px){.meal-grid{grid-template-columns:1fr}.recipe-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Maten</h1>
  <div class="header-sub">Familjs matplanering</div>
</header>
<div class="top-tabs" id="top-tabs">
  <button class="ttab active" data-view="matsedel">Matsedel</button>
  <button class="ttab" data-view="recept">Receptbank</button>
  <button class="ttab" data-view="inkop">Inkop</button>
</div>
<div class="week-nav" id="week-nav" style="display:none">
  <button class="wk-arrow" id="btn-prev">&#8592;</button>
  <span class="wk-label" id="wk-label"></span>
  <button class="wk-btn active" id="btn-current">Denna vecka</button>
  <button class="wk-btn" id="btn-next">Nasta vecka</button>
  <div class="sep"></div>
  <button class="wk-arrow" id="btn-next-wk">&#8594;</button>
</div>
<main>
  <div class="page active" id="page-matsedel">
    <div class="sec-block">
      <div class="sec-head">Matlada</div>
      <div class="meal-grid" id="grid-big"></div>
    </div>
    <div class="sec-block">
      <div class="sec-head">Hemma</div>
      <div class="meal-grid" id="grid-small"></div>
    </div>
  </div>
  <div class="page" id="page-recept">
    <div class="filter-row" id="filter-row"></div>
    <input class="search-box" id="search-box" placeholder="Sok recept..." type="text">
    <br><br>
    <div class="recipe-grid" id="recipe-grid"></div>
  </div>
  <div class="page" id="page-inkop">
    <div class="shop-input-row">
      <input class="shop-input" id="shop-input" placeholder="Lagg till..." type="text">
      <button class="shop-add-btn" id="shop-add-btn">+</button>
    </div>
    <div class="shop-actions">
      <button class="shop-act-btn" id="gen-list-btn">Generera fran matsedel</button>
      <button class="shop-act-btn" id="clear-done-btn">Rensa klara</button>
    </div>
    <div id="shop-list"></div>
  </div>
</main>
<button class="fab" id="fab" title="Nytt recept">+</button>
<div class="overlay" id="recipe-overlay">
  <div class="modal" id="recipe-modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="rm-title"></div>
        <div class="avg-rating" id="rm-avg"></div>
      </div>
      <button class="modal-close" id="rm-close">&#x2715;</button>
    </div>
    <div class="modal-tabs" id="rm-tabs">
      <button class="mtab active" data-tab="recept">Recept</button>
      <button class="mtab" data-tab="betyg">Betygsatt</button>
    </div>
    <div id="rm-body"></div>
    <button class="modal-del-btn" id="rm-del-btn">Ta bort recept</button>
  </div>
</div>
<div class="overlay" id="swap-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Byt ratt</div>
      <button class="modal-close" id="sw-close">&#x2715;</button>
    </div>
    <div class="swap-filter-row" id="sw-filter-row"></div>
    <div class="swap-grid" id="swap-grid"></div>
  </div>
</div>
<div class="overlay" id="add-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="add-modal-title">Nytt recept</div>
      <button class="modal-close" id="add-close">&#x2715;</button>
    </div>
    <div class="form-group"><label class="form-label">Namn</label><input class="form-input" id="add-name" placeholder="Receptnamn"></div>
    <div class="form-group"><label class="form-label">Beskrivning</label><textarea class="form-textarea" id="add-desc" placeholder="Kort beskrivning..."></textarea></div>
    <div class="form-group"><label class="form-label">Kok</label><input class="form-input" id="add-kok" placeholder="t.ex. Italienskt"></div>
    <div class="form-group">
      <label class="form-label">Taggar</label>
      <div class="tag-row" id="add-tags">
        <button class="tag-toggle" data-tag="kott">kott</button>
        <button class="tag-toggle" data-tag="fisk">fisk</button>
        <button class="tag-toggle" data-tag="gron">gron</button>
        <button class="tag-toggle" data-tag="baljvaxter">baljvaxter</button>
        <button class="tag-toggle" data-tag="potatis">potatis</button>
        <button class="tag-toggle" data-tag="matlada">matlada</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Portioner</label><input class="form-input" id="add-srv" type="number" value="4" min="1"></div>
    <div class="form-group"><label class="form-label">Ingredienser</label><div class="ing-editor" id="ing-editor"></div><button class="add-row-btn" id="add-ing-btn">+ Ingrediens</button></div>
    <div class="form-group"><label class="form-label">Steg</label><div class="steps-editor" id="steps-editor"></div><button class="add-row-btn" id="add-step-btn">+ Steg</button></div>
    <button class="save-btn" id="save-recipe-btn">Spara recept</button>
  </div>
</div>

function getMealsForWeek(w,y){

      (function(val){
        var b=document.createElement('button');b.className='star-btn';b.textContent=val;
        b.addEventListener('click',function(){selRating=val;document.querySelectorAll('.star-btn').forEach(function(sb,idx){sb.classList.toggle('sel',idx<val);});});
        starsRow.appendChild(b);
      })(i);
    }
    document.getElementById('save-rating-btn').addEventListener('click',function(){
      if(!selRating)return;
      if(!S.ratingsCache[name])S.ratingsCache[name]=[];
      S.ratingsCache[name].push(selRating);
      gasPost({action:'saveRating',namn:name,rating:selRating});
      document.getElementById('rm-avg').textContent='Betyg: '+avgRating(name)+'/10';
      closeOverlay('recipe-overlay');
    });
  }
}
function renderIngredients(){
  var name=S.currentRecipe;
  var customRec=S.customRecipes.find(function(r){return r.n===name;});
  var recData=RECIPES[name]||customRec||null;
  var list=document.getElementById('ing-list');
  var stepsList=document.getElementById('steps-list');
  if(!recData||!list)return;
  var base=recData.servings||4;
  var scale=S.currentServings/base;
  list.innerHTML='';
  (recData.ingredients||[]).forEach(function(row){
    var n=row[0],q=row[1]||'';
    var num=parseFloat(q);
    var scaledQ=isNaN(num)?q:((num*scale)%1===0?(num*scale).toString():(num*scale).toFixed(1))+q.replace(/[\d.,]+/,'').trim();
    var li=document.createElement('li');li.className='ing-row';
    li.innerHTML='<span>'+esc(n)+'</span><span class="qty">'+esc(scaledQ)+'</span>';
    li.addEventListener('click',function(){li.classList.toggle('checked');});
    list.appendChild(li);
  });
  if(stepsList){stepsList.innerHTML='';(recData.steps||[]).forEach(function(step){var li=document.createElement('li');li.className='step-item';li.textContent=step;stepsList.appendChild(li);});}
}
function openSwapModal(typ,pos,currentName){
  S.swapTarget={typ:typ,pos:pos};
  var pool=allPool();
  var filterRow=document.getElementById('sw-filter-row');
  var swapGrid=document.getElementById('swap-grid');
  if(!filterRow||!swapGrid)return;
  var cuisines=['Alla'].concat([...new Set(pool.map(function(m){return m.k;}).filter(Boolean))].sort());
  var swapFilter='Alla';
  function renderSwap(){
    swapGrid.innerHTML='';
    pool.filter(function(m){return m.n!==currentName&&(swapFilter==='Alla'||m.k===swapFilter);}).forEach(function(m){
      var card=document.createElement('div');card.className='swap-card';
      card.innerHTML='<div class="swap-card-name">'+esc(m.n)+'</div><div class="swap-card-kok">'+esc(m.k||'')+'</div>';
      card.addEventListener('click',function(){
        var key=wkKey(S.week,S.year);
        if(!S.mealsCache[key])S.mealsCache[key]={big:[null,null],small:[null,null]};
        if(!S.mealsCache[key][typ])S.mealsCache[key][typ]=[null,null];
        S.mealsCache[key][typ][pos]=m.n;
        gasPost({action:'saveMeal',week:S.week,year:S.year,typ:typ,pos:pos,namn:m.n});
        renderMatsedel();closeOverlay('swap-overlay');
      });
      swapGrid.appendChild(card);
    });
  }
  filterRow.innerHTML='';
  cuisines.forEach(function(c){
    var btn=document.createElement('button');btn.className='filter-chip'+(c==='Alla'?' active':'');btn.textContent=c;
    btn.addEventListener('click',function(){swapFilter=c;filterRow.querySelectorAll('.filter-chip').forEach(function(b){b.classList.toggle('active',b===btn);});renderSwap();});
    filterRow.appendChild(btn);
  });
  renderSwap();openOverlay('swap-overlay');
}
function matsedelSlots(name){
  var key=wkKey(S.week,S.year);var entry=S.mealsCache[key];if(!entry)return[];
  var slots=[];
  ['big','small'].forEach(function(typ){(entry[typ]||[]).forEach(function(n,pos){if(n===name)slots.push({typ:typ,pos:pos});});});
  return slots;
}
function addToMatsedel(name){
  var key=wkKey(S.week,S.year);
  if(!S.mealsCache[key])S.mealsCache[key]={big:[null,null],small:[null,null]};
  var entry=S.mealsCache[key];
  var types=['big','small'];
  for(var t=0;t<types.length;t++){var typ=types[t];if(!entry[typ])entry[typ]=[null,null];
    for(var pos=0;pos<2;pos++){if(!entry[typ][pos]){entry[typ][pos]=name;
      gasPost({action:'saveMeal',week:S.week,year:S.year,typ:typ,pos:pos,namn:name});
      renderMatsedel();return true;}}}
  return false;
}
function removeFromMatsedel(name){
  var key=wkKey(S.week,S.year);var entry=S.mealsCache[key];if(!entry)return;
  ['big','small'].forEach(function(typ){if(!entry[typ])return;
    entry[typ]=entry[typ].map(function(n,pos){
      if(n===name){gasPost({action:'saveMeal',week:S.week,year:S.year,typ:typ,pos:pos,namn:''});return null;}
      return n;
    });
  });
  renderMatsedel();
}
function renderRecipeBank(){
  var pool=allPool();
  var filterRow=document.getElementById('filter-row');
  var searchBox=document.getElementById('search-box');
  if(!filterRow||!searchBox)return;
  var cuisines=['Alla'].concat([...new Set(pool.map(function(m){return m.k;}).filter(Boolean))].sort(function(a,b){return a.localeCompare(b,'sv');}));
  filterRow.innerHTML='';
  cuisines.forEach(function(c){
    var btn=document.createElement('button');btn.className='filter-chip'+(c===S.filterCuisine?' active':'');btn.textContent=c;
    btn.addEventListener('click',function(){S.filterCuisine=c;filterRow.querySelectorAll('.filter-chip:not(.add-chip)').forEach(function(b){b.classList.toggle('active',b===btn);});renderRecipeList();});
    filterRow.appendChild(btn);
  });
  var addChip=document.createElement('button');addChip.className='filter-chip add-chip';addChip.textContent='+ Nytt recept';
  addChip.addEventListener('click',function(){openAddModal(null);});filterRow.appendChild(addChip);
  searchBox.value=S.searchQuery;
  searchBox.addEventListener('input',function(){S.searchQuery=searchBox.value.toLowerCase();renderRecipeList();});
  renderRecipeList();
}
function renderRecipeList(){
  var pool=allPool();var grid=document.getElementById('recipe-grid');if(!grid)return;
  var q=S.searchQuery||'';
  var filtered=pool.filter(function(m){return(S.filterCuisine==='Alla'||m.k===S.filterCuisine)&&(!q||m.n.toLowerCase().includes(q)||m.d.toLowerCase().includes(q));});
  grid.innerHTML='';
  filtered.forEach(function(m){
    var card=document.createElement('div');card.className='recipe-card';
    var tags=(m.t||[]).map(function(t){return'<span class="tag">'+esc(t)+'</span>';}).join('');
    var avg=avgRating(m.n);
    var onPlan=matsedelSlots(m.n).length>0;
    card.innerHTML='<div class="rc-name">'+esc(m.n)+'</div><div class="rc-cuisine">'+esc(m.k||'')+(avg?' &bull; '+avg+'/10':'')+'</div><div class="rc-tags">'+tags+'</div>'+'<button class="rc-plan-btn'+(onPlan?' on-plan':'')+'">'+( onPlan?'&#x2713; På planen':'+ Lägg till matsedel')+'</button>';
    card.addEventListener('click',function(){openRecipeModal(m.n);});
    (function(mn){var planBtn=card.querySelector('.rc-plan-btn');
      planBtn.addEventListener('click',function(e){e.stopPropagation();
        if(matsedelSlots(mn).length>0){removeFromMatsedel(mn);}
        else{if(!addToMatsedel(mn))alert('Matsedeln är full för denna vecka');}
        renderRecipeList();
      });
    })(m.n);
    grid.appendChild(card);
  });
}
function renderShopList(){
  var list=document.getElementById('shop-list');if(!list)return;list.innerHTML='';
  if(!S.shopItems.length){list.innerHTML='<p style="color:var(--muted);font-size:14px;padding:1rem 0">Tom lista</p>';return;}
  S.shopItems.forEach(function(item,i){
    var div=document.createElement('div');div.className='shop-item'+(item.done?' done':'');
    div.innerHTML='<div class="shop-check">'+(item.done?'&#x2713;':'')+'</div><span class="shop-name">'+esc(item.name)+'</span><button class="shop-del">&#x2715;</button>';
    div.querySelector('.shop-check').addEventListener('click',function(e){e.stopPropagation();S.shopItems[i].done=!S.shopItems[i].done;gasPost({action:'saveShopItems',items:S.shopItems});renderShopList();});
    div.querySelector('.shop-del').addEventListener('click',function(e){e.stopPropagation();S.shopItems.splice(i,1);gasPost({action:'saveShopItems',items:S.shopItems});renderShopList();});
    list.appendChild(div);
  });
}
function addShopItem(){var inp=document.getElementById('shop-input');if(!inp)return;var val=inp.value.trim();if(!val)return;S.shopItems.push({id:Date.now(),name:val,done:false});inp.value='';gasPost({action:'saveShopItems',items:S.shopItems});renderShopList();}
function generateShopList(){
  var meals=getMealsForWeek(S.week,S.year);
  var allMeals=[].concat(meals.big,meals.small).filter(Boolean);
  var items=[];
  allMeals.forEach(function(m){
    var customRec=S.customRecipes.find(function(r){return r.n===m.n;});
    var rec=RECIPES[m.n]||customRec;
    if(rec&&rec.ingredients){rec.ingredients.forEach(function(row){var nm=row[0];if(!S.shopItems.some(function(s){return s.name.toLowerCase()===nm.toLowerCase();})&&!items.some(function(s){return s.name.toLowerCase()===nm.toLowerCase();}))items.push({id:Date.now()+Math.random(),name:nm,done:false});});}
  });
  S.shopItems=S.shopItems.concat(items);gasPost({action:'saveShopItems',items:S.shopItems});renderShopList();
}
var addIngs=[['','']],addSteps=[''];
function openAddModal(editName){
  S.editingRecipe=editName;addIngs=[['','']];addSteps=[''];
  var title=document.getElementById('add-modal-title');if(title)title.textContent=editName?'Redigera recept':'Nytt recept';
  var nameEl=document.getElementById('add-name'),descEl=document.getElementById('add-desc'),kokEl=document.getElementById('add-kok'),srvEl=document.getElementById('add-srv');
  if(editName){
    var existing=S.customRecipes.find(function(r){return r.n===editName;});
    if(existing){
      if(nameEl)nameEl.value=existing.n;if(descEl)descEl.value=existing.d||'';if(kokEl)kokEl.value=existing.k||'';if(srvEl)srvEl.value=existing.servings||4;
      document.querySelectorAll('#add-tags .tag-toggle').forEach(function(btn){btn.classList.toggle('on',(existing.t||[]).includes(btn.getAttribute('data-tag')));});
      if(existing.ingredients)addIngs=existing.ingredients.map(function(r){return[r[0],r[1]||''];});
      if(existing.steps)addSteps=[].concat(existing.steps);
    }
  }else{
    if(nameEl)nameEl.value='';if(descEl)descEl.value='';if(kokEl)kokEl.value='';if(srvEl)srvEl.value='4';
    document.querySelectorAll('#add-tags .tag-toggle').forEach(function(btn){btn.classList.remove('on');});
    addIngs=[['','']];addSteps=[''];
  }
  renderIngEditor();renderStepEditor();openOverlay('add-overlay');
}
function renderIngEditor(){
  var editor=document.getElementById('ing-editor');if(!editor)return;editor.innerHTML='';
  addIngs.forEach(function(row,i){
    var div=document.createElement('div');div.className='ing-editor-row';
    div.innerHTML='<input class="ie-name" placeholder="Ingrediens" value="'+esc(row[0])+'"><input class="ie-qty" placeholder="Mangd" value="'+esc(row[1])+'"><button class="ie-del">&#x2715;</button>';
    div.querySelector('.ie-name').addEventListener('input',function(e){addIngs[i][0]=e.target.value;});
    div.querySelector('.ie-qty').addEventListener('input',function(e){addIngs[i][1]=e.target.value;});
    div.querySelector('.ie-del').addEventListener('click',function(){addIngs.splice(i,1);renderIngEditor();});
    editor.appendChild(div);
  });
}
function renderStepEditor(){
  var editor=document.getElementById('steps-editor');if(!editor)return;editor.innerHTML='';
  addSteps.forEach(function(step,i){
    var div=document.createElement('div');div.className='step-editor-row';
    div.innerHTML='<span class="se-num">'+(i+1)+'.</span><input class="se-text" placeholder="Beskriv steget..." value="'+esc(step)+'"><button class="ie-del">&#x2715;</button>';
    div.querySelector('.se-text').addEventListener('input',function(e){addSteps[i]=e.target.value;});
    div.querySelector('.ie-del').addEventListener('click',function(){addSteps.splice(i,1);renderStepEditor();});
    editor.appendChild(div);
  });
}
function saveRecipe(){
  var name=(document.getElementById('add-name')||{}).value||'';
  var desc=(document.getElementById('add-desc')||{}).value||'';
  var kok=(document.getElementById('add-kok')||{}).value||'';
  var srv=parseInt((document.getElementById('add-srv')||{}).value)||4;
  var tags=[];document.querySelectorAll('#add-tags .tag-toggle.on').forEach(function(b){tags.push(b.getAttribute('data-tag'));});
  if(!name.trim()){alert('Ange ett namn.');return;}
  var ingredients=addIngs.filter(function(r){return r[0].trim();});
  var steps=addSteps.filter(function(s){return s.trim();});
  var oldName=S.editingRecipe;
  if(oldName){S.customRecipes=S.customRecipes.filter(function(r){return r.n!==oldName;});if(RECIPES[oldName])delete RECIPES[oldName];gasPost({action:'deleteCustomRecipe',namn:oldName});}
  S.customRecipes.push({n:name,d:desc,k:kok,t:tags,custom:true});
  RECIPES[name]={servings:srv,ingredients:ingredients,steps:steps};
  gasPost({action:'saveCustomRecipe',recept:{n:name,d:desc,k:kok,t:tags,servings:srv,ingredients:ingredients,steps:steps}});
  closeOverlay('add-overlay');renderRecipeBank();
}
function deleteCurrentRecipe(){
  var name=S.currentRecipe;if(!name)return;
  if(!confirm('Ta bort "'+name+'"?'))return;
  var isCustom=S.customRecipes.some(function(r){return r.n===name;});
  if(isCustom){S.customRecipes=S.customRecipes.filter(function(r){return r.n!==name;});if(RECIPES[name])delete RECIPES[name];gasPost({action:'deleteCustomRecipe',namn:name});}
  else{S.deletedRecipes.add(name);gasPost({action:'deleteBuiltinRecipe',namn:name});}
  var key=wkKey(S.week,S.year);var entry=S.mealsCache[key];
  if(entry){['big','small'].forEach(function(typ){if(entry[typ])entry[typ]=entry[typ].map(function(n){return n===name?null:n;});});}
  closeOverlay('recipe-overlay');renderMatsedel();
  if(document.getElementById('page-recept').classList.contains('active'))renderRecipeList();
}
function openOverlay(id){var el=document.getElementById(id);if(el)el.classList.add('open');}
function closeOverlay(id){var el=document.getElementById(id);if(el)el.classList.remove('open');}
function setView(view){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  var pg=document.getElementById('page-'+view);if(pg)pg.classList.add('active');
  document.querySelectorAll('.ttab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-view')===view);});
  var weekNav=document.getElementById('week-nav');if(weekNav)weekNav.style.display=(view==='matsedel'?'flex':'none');
  var fab=document.getElementById('fab');if(fab)fab.classList.toggle('visible',view==='recept');
  if(view==='matsedel')renderMatsedel();
  if(view==='recept')renderRecipeBank();
  if(view==='inkop')renderShopList();
}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.ttab').forEach(function(tab){tab.addEventListener('click',function(){setView(tab.getAttribute('data-view'));});});
  document.getElementById('btn-prev').addEventListener('click',function(){if(S.week===1){S.year--;S.week=getISOWeeksInYear(S.year);}else S.week--;renderMatsedel();});
  document.getElementById('btn-next-wk').addEventListener('click',function(){var max=getISOWeeksInYear(S.year);if(S.week===max){S.week=1;S.year++;}else S.week++;renderMatsedel();});
  document.getElementById('btn-current').addEventListener('click',function(){var w=getISOWeek(new Date());S.week=w.week;S.year=w.year;renderMatsedel();});
  document.getElementById('btn-next').addEventListener('click',function(){var w=getISOWeek(new Date());var max=getISOWeeksInYear(w.year);S.week=(w.week===max?1:w.week+1);S.year=(w.week===max?w.year+1:w.year);renderMatsedel();});
  document.getElementById('rm-close').addEventListener('click',function(){closeOverlay('recipe-overlay');});
  document.getElementById('recipe-overlay').addEventListener('click',function(e){if(e.target===this)closeOverlay('recipe-overlay');});
  document.getElementById('rm-tabs').addEventListener('click',function(e){var btn=e.target.closest('.mtab');if(!btn)return;S.currentTab=btn.getAttribute('data-tab');document.querySelectorAll('#rm-tabs .mtab').forEach(function(t){t.classList.toggle('active',t===btn);});renderRecipeBody();});
  document.getElementById('rm-del-btn').addEventListener('click',deleteCurrentRecipe);
  document.getElementById('sw-close').addEventListener('click',function(){closeOverlay('swap-overlay');});
  document.getElementById('swap-overlay').addEventListener('click',function(e){if(e.target===this)closeOverlay('swap-overlay');});
  document.getElementById('add-close').addEventListener('click',function(){closeOverlay('add-overlay');});
  document.getElementById('add-overlay').addEventListener('click',function(e){if(e.target===this)closeOverlay('add-overlay');});
  document.getElementById('add-ing-btn').addEventListener('click',function(){addIngs.push(['','']);renderIngEditor();});
  document.getElementById('add-step-btn').addEventListener('click',function(){addSteps.push('');renderStepEditor();});
  document.getElementById('save-recipe-btn').addEventListener('click',saveRecipe);
  document.querySelectorAll('#add-tags .tag-toggle').forEach(function(btn){btn.addEventListener('click',function(){btn.classList.toggle('on');});});
  document.getElementById('fab').addEventListener('click',function(){openAddModal(null);});
  document.getElementById('shop-add-btn').addEventListener('click',addShopItem);
  document.getElementById('shop-input').addEventListener('keydown',function(e){if(e.key==='Enter')addShopItem();});
  document.getElementById('clear-done-btn').addEventListener('click',function(){S.shopItems=S.shopItems.filter(function(i){return!i.done;});gasPost({action:'saveShopItems',items:S.shopItems});renderShopList();});
  document.getElementById('gen-list-btn').addEventListener('click',generateShopList);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeOverlay('recipe-overlay');closeOverlay('swap-overlay');closeOverlay('add-overlay');}});
  var w=getISOWeek(new Date());S.week=w.week;S.year=w.year;
  (async function(){
    var all=await gasGet('getAll');
    if(all&&!all.error){
      if(all.meals&&typeof all.meals==='object')Object.assign(S.mealsCache,all.meals);
      if(all.portions&&typeof all.portions==='object'&&!Array.isArray(all.portions))Object.assign(S.portionsState,all.portions);
      if(all.ratings&&typeof all.ratings==='object')Object.assign(S.ratingsCache,all.ratings);
      if(Array.isArray(all.shopItems))S.shopItems=all.shopItems;
      if(Array.isArray(all.customRecipes)){all.customRecipes.forEach(function(r){S.customRecipes.push({n:r.namn||r.n,d:r.beskrivning||r.d,k:r.kok||r.k,t:r.taggar||r.t||[],custom:true});if(r.steg||r.ingredienser)RECIPES[r.namn||r.n]={servings:r.portioner||r.servings||4,ingredients:r.ingredienser||r.ingredients||[],steps:r.steg||r.steps||[]};});}
      if(Array.isArray(all.deletedRecipes))all.deletedRecipes.forEach(function(n){S.deletedRecipes.add(n);});
    }
    setView('matsedel');
  })();
});
</script>
