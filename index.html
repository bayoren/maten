const recipes={
  "Röd linschili med kokosmjölk":{servings:6,ingredients:[["Röda linser","400 g"],["Kokosmjölk","400 ml"],["Krossade tomater","400 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Färsk ingefära","2 msk riven"],["Spiskummin, mald","2 tsk"],["Koriander, mald","1 tsk"],["Garam masala","1 tsk"],["Chiliflakes","½ tsk"],["Grönsaksbuljongtärning","1 st"],["Rapsolja","2 msk"],["Salt & peppar","efter smak"],["Färsk koriander","till servering"],["Ris (basmati)","till servering"]],steps:["Hacka lök och vitlök fint. Riv ingefäran.","Fräs lök i olja på medelvärme ca 5 min. Tillsätt vitlök och ingefära, fräs 1 min.","Rör ner spiskummin, koriander, garam masala och chiliflakes. Fräs 30 sekunder.","Skölj linserna. Tillsätt linser, krossade tomater och kokosmjölk. Rör om.","Lös buljong i 3 dl vatten och häll i grytan. Koka upp.","Sänk värmen, lägg på lock och sjud 25–30 min tills linserna är mjuka. Rör om ibland.","Smaka av med salt, peppar och ev. mer chili. Servera med ris och färsk koriander."]},
  "Ugnsbakad lax med klyftpotatis och örter":{servings:4,ingredients:[["Laxfilé","600 g"],["Fast potatis","800 g"],["Fetaost","100 g"],["Citron","1 st"],["Vitlök","3 klyftor"],["Färsk rosmarin","3 kvistar"],["Olivolja","3 msk"],["Grönkål","100 g"],["Dijonsenap","1 msk"],["Honung","1 tsk"],["Salt & peppar","efter smak"]],steps:["Värm ugnen till 200°C. Skär potatisen i klyftor och blanda med olivolja, hackad vitlök, rosmarin, salt och peppar.","Bred ut potatisen på en plåt och rosta 25 min.","Vispa ihop citronjuice, senap, honung och 1 msk olivolja till en dressing.","Lägg laxen på plåten bland potatisen, pensla med dressingen. Smula över fetaost.","Baka ytterligare 12–15 min tills laxen är genomvarm.","Massera grönkålen med lite olivolja och citronsaft. Servera allt tillsammans."]},
  "Klassisk lasagne med köttfärssås och bechamel":{servings:6,ingredients:[["Nötfärs","500 g"],["Krossade tomater","800 g"],["Gul lök","2 st"],["Vitlök","3 klyftor"],["Tomatpuré","2 msk"],["Torrt rödvin","1 dl"],["Oregano, torkad","2 tsk"],["Lasagneplattor","12–15 st"],["Riven ost","150 g"],["— Bechamel —",""],["Smör","50 g"],["Vetemjöl","4 msk"],["Mjölk","6 dl"],["Muskotnöt, riven","½ tsk"],["Salt & peppar","efter smak"]],steps:["Hacka lök och vitlök. Fräs i olja tills mjuk, ca 5 min. Tillsätt köttfärs och bryn.","Rör ner tomatpuré, oregano och rödvin. Koka 1 min. Tillsätt krossade tomater.","Sjud köttfärssåsen på låg värme 20–25 min. Smaka av med salt och peppar.","Bechamel: Smält smör i en kastrull. Rör ner mjöl och fräs 1 min. Häll i mjölk lite i taget under konstant vispning.","Koka bechamelen under omrörning tills tjock, ca 5 min. Krydda med muskotnöt, salt och peppar.","Värm ugnen till 200°C. Varva köttfärssås, lasagneplattor och bechamel i en form. Avsluta med bechamel och riven ost.","Grädda 35–40 min tills gyllenbrun. Låt vila 10 min före servering."]},
  "Vegetariska tacos":{servings:4,ingredients:[["Svarta bönor (burk)","2 x 400 g"],["Majs (burk)","1 x 200 g"],["Mjuka tortillas","8–10 st"],["Avocado","2 st"],["Körsbärstomater","200 g"],["Rödlök","1 st"],["Jalapeño (inlagd)","efter smak"],["Lime","1 st"],["Spiskummin","1 tsk"],["Paprikapulver, rökt","1 tsk"],["Olivolja","1 msk"],["Koriander","½ kruka"],["Crème fraîche","till servering"],["Salt","efter smak"]],steps:["Skölj och avrina bönor och majs. Fräs med spiskummin och paprikapulver i olivolja 3–4 min. Smaka av med salt.","Tärna avocado, halvera tomaterna, finhacka rödlök och koriander. Blanda med limejuice.","Värm tortillorna torrt i stekpanna eller i ugn (200°C, 3 min).","Lägg upp alla tillbehör och låt var och en bygga sina egna tacos."]},
  "Svarta bönor i chipotle och tomatbas":{servings:6,ingredients:[["Svarta bönor (burk)","3 x 400 g"],["Krossade tomater","400 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Chipotlepasta","2 msk"],["Spiskummin","2 tsk"],["Oregano","1 tsk"],["Grönsaksbuljongtärning","1 st"],["Rapsolja","2 msk"],["Lime","1 st"],["Crème fraîche","till servering"],["Ris","till servering"],["Salt & peppar","efter smak"]],steps:["Hacka lök och vitlök, fräs i olja ca 5 min.","Tillsätt chipotlepasta, spiskummin och oregano. Fräs 1 min.","Rör ner krossade tomater och avrinnade bönor. Häll i 2 dl vatten med buljong.","Sjud 20 min tills såsen tjocknat. Smaka av med limejuice, salt och peppar.","Servera med ris och en klick crème fraîche."]},
  "Torskrygg med rotmossmos och skirat smör":{servings:4,ingredients:[["Torskrygg","600 g"],["Rotselleri","400 g"],["Fast potatis","400 g"],["Smör","100 g"],["Mjölk eller grädde","1 dl"],["Kapris","2 msk"],["Dill","½ kruka"],["Citron","1 st"],["Salt & vitpeppar","efter smak"]],steps:["Skala och tärna rotselleri och potatis. Koka mjuka i saltat vatten, ca 20 min.","Häll av vattnet. Mosa med smör (50 g) och mjölk. Smaka av med salt och vitpeppar.","Salta torskryggen. Stek i smör på medelvärme 3–4 min per sida tills genomvarm.","Skira resterande smör i en liten kastrull tills gyllengult och nötaktigt, ca 3 min.","Servera torsken på moset. Toppa med skirat smör, kapris, dill och citronsaft."]},
  "Halloumi med klyftpotatis och grönsalsa":{servings:4,ingredients:[["Halloumi","400 g"],["Fast potatis","700 g"],["Olivolja","3 msk"],["— Salsa verde —",""],["Persilja","1 kruka"],["Basilika","½ kruka"],["Kapris","2 msk"],["Vitlök","1 klyfta"],["Dijonsenap","1 tsk"],["Citronsaft","2 msk"],["Olivolja (salsa)","3 msk"],["Salt & peppar","efter smak"]],steps:["Skär potatis i klyftor, blanda med olivolja, salt och peppar. Rosta i 200°C ca 30 min.","Mixa persilja, basilika, kapris, vitlök, senap och citronsaft till en grov salsa. Tillsätt olivolja och smaka av.","Skär halloumin i skivor, ca 1 cm tjocka. Stek i torr het panna 2 min per sida tills gyllenbrun.","Servera halloumi och potatis med riklig salsa verde."]},
  "Thai grön curry med tofu och grönsaker":{servings:4,ingredients:[["Fast tofu","400 g"],["Kokosmjölk","400 ml"],["Grön currypasta","2–3 msk"],["Zucchini","1 st"],["Röd paprika","1 st"],["Sockerärtor","150 g"],["Babyspenat","60 g"],["Fisksås eller sojasås","2 msk"],["Palmsocker","1 tsk"],["Lime","1 st"],["Kokosolja","1 msk"],["Jasminris","till servering"]],steps:["Pressa tofu torr, tärna och stek gyllenbrun i kokosolja ca 5 min. Ta ur pannan.","Fräs currypastan i samma panna 1 min. Häll i kokosmjölken och koka upp.","Tillsätt zucchini och paprika, sjud 5 min. Lägg i sockerärtor och tofu.","Smaka av med fisksås, socker och lime. Rör ner spenaten sist.","Servera med jasminris och basilika."]},
  "Gul linssoppa med kummin och citron":{servings:6,ingredients:[["Gula linser","400 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Morötter","2 st"],["Spiskummin","2 tsk"],["Gurkmeja","1 tsk"],["Koriander, mald","1 tsk"],["Cayennepeppar","¼ tsk"],["Grönsaksbuljongtärning","2 st"],["Citron","1 st"],["Olivolja","2 msk"],["Salt & peppar","efter smak"],["Knäckebröd","till servering"]],steps:["Hacka lök, vitlök och morötter. Fräs i olivolja ca 5 min.","Tillsätt spiskummin, gurkmeja, koriander och cayenne. Fräs 1 min.","Skölj linserna och tillsätt med 1,5 liter vatten och buljongtärningar. Koka upp.","Sjud under lock 25 min tills linser och morötter är mjuka.","Mixa slät med stavmixer. Smaka av med citronjuice, salt och peppar.","Servera med knäckebröd och en ringla olivolja."]},
  "Köttfärssås med pasta och rotgrönsaker":{servings:6,ingredients:[["Nötfärs","500 g"],["Krossade tomater","800 g"],["Gul lök","2 st"],["Morot","2 st"],["Selleri","2 stjälkar"],["Vitlök","3 klyftor"],["Tomatpuré","2 msk"],["Rödvin","1 dl"],["Oregano & basilika","1 tsk vardera"],["Olivolja","2 msk"],["Pasta","till servering"],["Riven parmesan","till servering"],["Salt & peppar","efter smak"]],steps:["Finhacka lök, morot, selleri och vitlök. Fräs mjukt i olivolja ca 8 min.","Höj värmen, tillsätt köttfärs och bryn väl. Rör ner tomatpuré.","Häll i rödvin, låt avdunsta 2 min. Tillsätt krossade tomater och örter.","Sjud på låg värme 30–40 min. Smaka av med salt och peppar.","Koka pasta enligt förpackning. Servera med riklig sås och riven parmesan."]},
  "Potatissoppa med brynt smör och gräslök":{servings:4,ingredients:[["Mjölig potatis","800 g"],["Purjolök","2 st"],["Smör","75 g"],["Grädde","1 dl"],["Grönsaksbuljongtärning","2 st"],["Vitlök","2 klyftor"],["Gräslök","½ kruka"],["Salt & vitpeppar","efter smak"]],steps:["Skala och tärna potatis. Skiva purjolök. Fräs purjolök i 25 g smör 3 min.","Tillsätt potatis, vitlök och 1,2 liter vatten med buljongtärningar. Koka 20 min.","Mixa slät. Rör ner grädde, smaka av med salt och vitpeppar.","Bryn resterande smör i en liten kastrull tills gyllengult och nötaktigt.","Servera soppan med brynt smör ringat ovanpå och klippt gräslök."]},
  "Marockansk kikärtsgryta med morötter":{servings:6,ingredients:[["Kikärter (burk)","2 x 400 g"],["Morötter","4 st"],["Krossade tomater","400 g"],["Gul lök","2 st"],["Vitlök","3 klyftor"],["Torkade aprikoser","100 g"],["Spiskummin","2 tsk"],["Kanel","1 tsk"],["Koriander, mald","1 tsk"],["Ingefära, mald","½ tsk"],["Harissa","1 tsk"],["Grönsaksbuljongtärning","1 st"],["Couscous","till servering"],["Färsk koriander","till servering"]],steps:["Skär morötter i bitar, hacka lök och vitlök. Fräs i olja 5 min.","Tillsätt alla kryddor och harissa, fräs 1 min.","Häll i tomater, kikärter, tärnade aprikoser och 3 dl vatten med buljong.","Sjud under lock 30 min tills morötter är mjuka. Smaka av.","Koka couscous enligt förpackning. Servera grytan med couscous och koriander."]},
  "Senapslax med dillpotatis och spenat":{servings:4,ingredients:[["Laxfilé","600 g"],["Fast potatis","700 g"],["Babyspenat","100 g"],["Dijonsenap","3 msk"],["Honung","1 msk"],["Citron","1 st"],["Dill","1 kruka"],["Smör","20 g"],["Olivolja","2 msk"],["Salt & peppar","efter smak"]],steps:["Koka potatis i saltat vatten tills mjuk. Häll av och vänd med smör och hackad dill.","Blanda senap, honung, citronskal och lite citronsaft till marinad.","Lägg laxen i ugnsform, bred senapsmarinaden ovanpå. Baka i 200°C ca 12–14 min.","Fräs spenaten snabbt i lite olivolja tills precis ihopfalld.","Servera laxen med dillpotatis och spenat."]},
  "Klyftpotatis med tzatziki och grönsaker":{servings:4,ingredients:[["Fast potatis","800 g"],["Olivolja","3 msk"],["Paprikapulver","1 tsk"],["— Tzatziki —",""],["Turkisk yoghurt (10%)","300 g"],["Gurka","½ st"],["Vitlök","1–2 klyftor"],["Olivolja (tzatziki)","1 msk"],["Dill eller mynta","1 msk hackad"],["Citronsaft","1 msk"],["— Tabbouleh —",""],["Bulgur","150 g"],["Tomater","2 st"],["Persilja","1 kruka"],["Citron","1 st"],["Salt & peppar","efter smak"]],steps:["Klyfta potatisen, blanda med olivolja, paprika, salt och peppar. Rosta i 220°C ca 30 min.","Riv gurkan grovt, salta och krama ur vätska. Blanda med yoghurt, pressad vitlök, dill, citronsaft och olja. Kyl.","Koka bulgur enligt förpackning, svalna. Blanda med tärnade tomater, persilja och citronjuice.","Servera klyftpotatis med tzatziki och tabbouleh."]},
  "Pytt i panna":{servings:4,ingredients:[["Kokt potatis","600 g"],["Kokt kött (nöt/fläsk)","300 g"],["Gul lök","2 st"],["Rödbeta (inlagd)","1 burk"],["Smör","50 g"],["Ägg","4 st"],["Salt & peppar","efter smak"],["Persilja","till servering"]],steps:["Tärna potatis och kött i lika stora bitar, ca 1 cm. Hacka löken.","Stek lök i smör tills mjuk. Tillsätt potatis och stek gyllenbrun utan att röra för mycket, ca 8 min.","Tillsätt köttet och fräs ytterligare 5 min. Smaka av med salt och peppar.","Stek äggen separat, gärna med rinnig gula.","Servera pytten toppat med ett ägg och rödbeta på sidan. Strö över persilja."]},
  "Röda kidney-bönor i tomatchili":{servings:6,ingredients:[["Kidney-bönor (burk)","3 x 400 g"],["Krossade tomater","800 g"],["Gul lök","2 st"],["Röd paprika","2 st"],["Vitlök","4 klyftor"],["Chipotle/ancho-chili","2 tsk"],["Spiskummin","2 tsk"],["Paprikapulver, rökt","1 tsk"],["Grönsaksbuljongtärning","1 st"],["Avocado","2 st"],["Lime","1 st"],["Ris","till servering"],["Salt & peppar","efter smak"]],steps:["Hacka lök, paprika och vitlök. Fräs i olja ca 6 min.","Tillsätt chili, spiskummin och paprikapulver. Fräs 1 min.","Häll i tomater, bönor och buljong löst i 1 dl vatten. Koka upp.","Sjud 25 min tills såsen tjocknat. Smaka av med salt, peppar och limejuice.","Servera med ris och skivad avocado."]},
  "Fiskgratäng med klyftpotatis och dillsås":{servings:4,ingredients:[["Vit fisk (torsk/sej)","600 g"],["Fast potatis","700 g"],["Riven ost","100 g"],["Ströbröd","3 msk"],["Olivolja","2 msk"],["— Dillsås —",""],["Smör","25 g"],["Vetemjöl","2 msk"],["Mjölk","3 dl"],["Dill","1 kruka"],["Citron","½ st"],["Salt & vitpeppar","efter smak"]],steps:["Klyfta potatisen, rosta med olivolja, salt och peppar i 200°C ca 25 min.","Lägg fisken i ugnsform, salta och peppra. Blanda ost med ströbröd och strö över.","Grädda fisken i 200°C ca 15 min tills ostskorpan är gyllenbrun.","Dillsås: smält smör, rör ner mjöl. Vispa in mjölk lite i taget. Koka tjock. Rör ner hackad dill och citronsaft.","Servera gratängen med klyftpotatis och dillsåsen."]},
  "Dal makhani (smörlinser)":{servings:6,ingredients:[["Svarta linser (urad dal)","300 g"],["Kidney-bönor (burk)","1 x 400 g"],["Smör","75 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Färsk ingefära","2 msk riven"],["Krossade tomater","400 g"],["Grädde","1 dl"],["Garam masala","1 tsk"],["Spiskummin","1 tsk"],["Koriander, mald","1 tsk"],["Chilipulver","½ tsk"],["Salt","efter smak"],["Ris","till servering"]],steps:["Blötlägg linserna minst 8 timmar. Koka i nytt vatten 1 timme tills mjuka.","Fräs lök i smör ca 8 min tills gyllenbrun. Tillsätt vitlök och ingefära, fräs 2 min.","Rör ner alla kryddor, fräs 1 min. Tillsätt tomater och sjud 10 min.","Häll i kokta linser, kidney-bönor och ev. lite vatten. Sjud 20–30 min, rör om ibland.","Rör ner grädde och smör. Smaka av med salt. Servera med ris."]},
  "Pasta cacio e pepe":{servings:4,ingredients:[["Spaghetti eller tonnarelli","400 g"],["Pecorino Romano, riven","100 g"],["Parmigiano Reggiano, riven","50 g"],["Svartpeppar, grovmalen","2 tsk"],["Salt","efter smak"],["Pastavatten","2–3 dl"]],steps:["Koka pastan al dente i rikligt saltat vatten. Spara 3 dl pastavatten.","Rosta svartpepparn torrt i en stor panna tills doftande, ca 1 min. Häll i 1 dl pastavatten.","Dra av värmen. Blanda ostar med lite pastavatten till en pasta.","Lägg i den avrunna pastan, rör kraftigt och tillsätt osten gradvis med pastavatten till krämig konsistens.","Servera omedelbart med mer peppar och ost."]},
  "Pasta all'arrabbiata":{servings:4,ingredients:[["Penne","400 g"],["Krossade tomater","800 g"],["Vitlök","4 klyftor"],["Röd chili, torkad","1–2 st"],["Olivolja","3 msk"],["Persilja","½ kruka"],["Salt","efter smak"]],steps:["Skiva vitlök tunt. Fräs med chili i olivolja på medel-låg värme tills vitlöken är gyllenbrun, ca 3 min.","Häll i krossade tomater, salta. Sjud 15 min.","Koka penne al dente. Blanda med såsen.","Toppa med hackad persilja och ett ringel olivolja."]},
  "Risotto med svamp och parmesan":{servings:4,ingredients:[["Arborioris","320 g"],["Blandad svamp (porcini, champinjon)","400 g"],["Torkad porcini","20 g"],["Gul lök","1 st"],["Vitlök","2 klyftor"],["Vitt vin","1 dl"],["Grönsaksbuljongtärning","2 st"],["Smör","60 g"],["Parmigiano, riven","80 g"],["Olivolja","2 msk"],["Timjan","4 kvistar"],["Salt & peppar","efter smak"]],steps:["Blötlägg torkad porcini i 3 dl varmt vatten 20 min. Sila, spara vätskan. Koka 1 l buljong, håll varm.","Finhacka lök och vitlök. Fräs i olivolja och 20 g smör tills mjuk, ca 5 min.","Tillsätt riset, rosta 2 min. Häll i vin, rör tills det absorberats.","Tillsätt buljong en slev i taget, rör konstant. Tillsätt porcinivatten med. Fortsätt 18 min.","Fräs färsk svamp separat med timjan i smör tills gyllenbrun.","Rör ner resterande smör och parmesan i riset. Servera toppat med svamp."]},
  "Gnocchi med gorgonzolasås":{servings:4,ingredients:[["Färska gnocchi","500 g"],["Gorgonzola dolce","150 g"],["Grädde","2 dl"],["Valnötter","60 g"],["Smör","20 g"],["Salvia","8 blad"],["Parmigiano, riven","30 g"],["Salt & peppar","efter smak"]],steps:["Rosta valnötterna torrt i panna, grovhacka.","Smält gorgonzola i grädde på låg värme, rör tills slät. Krydda med peppar.","Koka gnocchi enligt förpackning tills de flyter upp. Lyft upp med hålslev.","Fräs salvian i smör tills krispig.","Blanda gnocchi med gorgonzolasås. Toppa med valnötter, salvia och parmesan."]},
  "Minestrone":{servings:6,ingredients:[["Kidneybönor (burk)","1 x 400 g"],["Krossade tomater","400 g"],["Zucchini","1 st"],["Morot","2 st"],["Selleri","2 stjälkar"],["Gul lök","1 st"],["Vitlök","3 klyftor"],["Purjolök","1 st"],["Ditalini-pasta","100 g"],["Grönsaksbuljongtärning","2 st"],["Olivolja","2 msk"],["Basilika","½ kruka"],["Parmigiano-skorp","1 st"],["Salt & peppar","efter smak"]],steps:["Hacka alla grönsaker. Fräs lök, selleri och morot i olivolja ca 6 min.","Tillsätt vitlök och purjolök, fräs 2 min. Rör ner tomatpuré.","Häll i tomater, bönor, 1,5 l vatten, buljong och parmesan-skorpen.","Sjud 20 min. Tillsätt zucchini och pasta de sista 10 min.","Smaka av, toppa med basilika och ett ringel olivolja."]},
  "Pasta e fagioli":{servings:4,ingredients:[["Borlottibönor (burk)","2 x 400 g"],["Ditalini","150 g"],["Krossade tomater","200 g"],["Gul lök","1 st"],["Vitlök","3 klyftor"],["Selleri","2 stjälkar"],["Rosmarin","2 kvistar"],["Olivolja","3 msk"],["Grönsaksbuljongtärning","1 st"],["Salt & peppar","efter smak"]],steps:["Hacka lök, vitlök och selleri. Fräs i olivolja med rosmarin ca 5 min.","Tillsätt tomater och bönor. Sjud 10 min.","Mixa hälften av bönorna slät, blanda tillbaka.","Häll i 8 dl vatten med buljong. Koka upp, tillsätt pasta.","Koka tills pasta är al dente. Justera konsistens med vatten. Smaka av."]},
  "Pollo al limone":{servings:4,ingredients:[["Kycklinglår (urbenade)","800 g"],["Citron","2 st"],["Vitt vin","1,5 dl"],["Vitlök","4 klyftor"],["Kapris","2 msk"],["Smör","30 g"],["Olivolja","2 msk"],["Timjan","4 kvistar"],["Salt & peppar","efter smak"],["Pasta","till servering"]],steps:["Salta och peppra kycklingen. Bryn i olivolja på hög värme 4 min per sida.","Tillsätt krossad vitlök och timjan, fräs 1 min. Häll i vin, skrapa botten.","Pressa i citronsaft, tillsätt citronskal och kapris.","Sjud under lock 20 min tills kyckling är genomvarm.","Rör ner smöret, smaka av. Servera med pasta."]},
  "Saltimbocca":{servings:4,ingredients:[["Kalvschnitzlar","4 st (ca 150 g/st)"],["Prosciutto crudo","8 skivor"],["Salvia","16 blad"],["Smör","60 g"],["Vitt vin","1,5 dl"],["Salt & peppar","efter smak"],["Potatismos","till servering"]],steps:["Lägg 2 salviablad på varje schnitzel, täck med 2 skivor prosciutto. Fäst med tandpetare.","Vänd i lite mjöl. Stek i smör, prosciuttosidan ner, 2 min. Vänd och stek 1 min.","Ta ur köttet. Häll vin i pannan, skrapa botten. Reducera 2 min.","Lägg tillbaka köttet, värm 1 min. Servera med mos och skyn."]},
  "Chicken fajitas":{servings:4,ingredients:[["Kycklinglår (strimlat)","700 g"],["Röd & gul paprika","2 st"],["Rödlök","2 st"],["Lime","2 st"],["Spiskummin","1 tsk"],["Chilipulver","1 tsk"],["Rökt paprikapulver","1 tsk"],["Vitlök","2 klyftor"],["Olivolja","2 msk"],["Mjuka tortillas","8 st"],["Guacamole, salsa, crème fraîche","till servering"]],steps:["Marinera kyckling med lime, spiskummin, chili, paprikapulver, vitlök och olja i 30 min.","Strimla paprika och lök. Woka i het panna 4–5 min tills mjuk med lite färg.","Stek kycklingen i het panna i omgångar tills genomstekt och brynt, ca 6 min.","Värm tortillas. Servera allt separat så var och en bygger sina fajitas."]},
  "Enchiladas med röd sås":{servings:4,ingredients:[["Mjuka tortillas","8 st"],["Svarta bönor (burk)","1 x 400 g"],["Riven ost (cheddar/mozzarella)","200 g"],["Röd enchilada-sås","400 ml"],["Röd paprika","1 st"],["Majs (burk)","1 x 200 g"],["Spiskummin","1 tsk"],["Rödlök","1 st"],["Koriander","till servering"],["Crème fraîche","till servering"]],steps:["Hacka lök och paprika, fräs mjukt 5 min. Blanda med bönor, majs och spiskummin.","Häll hälften av enchilada-såsen i botten av ugnsform.","Fyll tortillorna med bönfyllning och lite ost, rulla ihop och lägg i form.","Täck med resterande sås och resten av osten. Grädda 200°C, 20 min.","Toppa med koriander och crème fraîche."]},
  "Pozole rojo":{servings:6,ingredients:[["Fläskskuldra","700 g"],["Hominy/vit majs (burk)","2 x 400 g"],["Torkad ancho-chile","3 st"],["Torkad guajillo-chile","3 st"],["Gul lök","2 st"],["Vitlök","5 klyftor"],["Oregano","1 tsk"],["Kycklingbuljongtärning","2 st"],["Salladskål, radisa, lime","till servering"],["Salt","efter smak"]],steps:["Koka fläsket med lök, vitlök och salt i 1,5 h tills mört. Ta ur köttet, spara buljongen.","Rosta torkad chile torrt 1 min, lägg i varmt vatten 20 min. Mixa med lite buljong till sås.","Sila chilesåsen ner i buljongen. Tillsätt hominy och oregano, sjud 20 min.","Strimla fläsket, lägg tillbaka. Smaka av.","Servera i djupa skålar med kål, radisa, oregano och lime."]},
  "Huevos rancheros":{servings:4,ingredients:[["Ägg","8 st"],["Majstortillas","8 st"],["Krossade tomater","400 g"],["Röd paprika","1 st"],["Jalapeño","1 st"],["Vitlök","2 klyftor"],["Spiskummin","1 tsk"],["Avocado","2 st"],["Crème fraîche","till servering"],["Koriander","till servering"],["Olivolja","2 msk"]],steps:["Hacka paprika, jalapeño och vitlök. Fräs i olja 4 min.","Tillsätt tomater och spiskummin, sjud 10 min. Smaka av.","Stek tortillas torrt i het panna 30 sek per sida.","Gör gropar i såsen, knäck äggen, lägg lock på och pochera 4–5 min.","Servera ägg på tortillas med skivad avocado, crème fraîche och koriander."]},
  "Palak paneer":{servings:4,ingredients:[["Paneer","300 g"],["Babyspenat","500 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Färsk ingefära","2 msk riven"],["Garam masala","1 tsk"],["Spiskummin","1 tsk"],["Koriander, mald","1 tsk"],["Grädde","1 dl"],["Smör","30 g"],["Salt","efter smak"],["Naan","till servering"]],steps:["Blanchera spenat 2 min, kyl snabbt. Mixa slät med lite vatten.","Tärna paneer, stek gyllenbrun i smör. Lägg åt sidan.","Fräs hackad lök tills gyllenbrun, ca 10 min. Tillsätt vitlök och ingefära, fräs 2 min.","Tillsätt kryddor, fräs 1 min. Häll i spenatpurén, sjud 5 min.","Rör ner grädde och paneer, värm 2 min. Servera med naan."]},
  "Chana masala":{servings:4,ingredients:[["Kikärter (burk)","2 x 400 g"],["Krossade tomater","400 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Ingefära","2 msk riven"],["Garam masala","1,5 tsk"],["Spiskummin","1 tsk"],["Koriander, mald","1 tsk"],["Amchur (mangopulver)","½ tsk"],["Rapsolja","2 msk"],["Koriander","till servering"],["Ris eller naan","till servering"]],steps:["Fräs hackad lök i olja tills gyllenbrun, ca 10 min.","Tillsätt vitlök och ingefära, fräs 2 min. Rör ner alla kryddor utom amchur, fräs 1 min.","Häll i tomater, sjud 10 min.","Tillsätt kikärter och amchur, sjud 15 min. Mosa lätt några kikärter för tjockare sås.","Servera med ris och koriander."]},
  "Butter chicken":{servings:4,ingredients:[["Kycklinglår (utur ben)","700 g"],["Krossade tomater","400 g"],["Grädde","2 dl"],["Smör","50 g"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Ingefära","2 msk riven"],["Garam masala","1,5 tsk"],["Spiskummin","1 tsk"],["Gurkmeja","½ tsk"],["Chilipulver","½ tsk"],["Yoghurt","1 dl (marinad)"],["Salt","efter smak"],["Ris","till servering"]],steps:["Marinera kyckling i yoghurt, hälften av kryddorna och salt, minst 1 h.","Stek kycklingen i smör tills brynt och genomvarm, ca 8 min. Ta ur.","Fräs lök i smör tills gyllenbrun. Tillsätt vitlök, ingefära och resten av kryddorna, fräs 2 min.","Häll i tomater, mixa slät med stavmixer. Sjud 10 min.","Rör ner grädde och kyckling, sjud 10 min. Servera med ris."]},
  "Aloo gobi":{servings:4,ingredients:[["Potatis","500 g"],["Blomkål","1 st (ca 500 g)"],["Gul lök","1 st"],["Vitlök","3 klyftor"],["Ingefära","1 msk riven"],["Gurkmeja","1 tsk"],["Spiskummin","1 tsk"],["Koriander, mald","1 tsk"],["Chilipulver","¼ tsk"],["Rapsolja","2 msk"],["Färsk koriander","till servering"],["Salt","efter smak"]],steps:["Tärna potatis, dela blomkålen i buketter. Koka potatis 5 min, avrina.","Fräs hackad lök i olja tills gyllenbrun. Tillsätt vitlök och ingefära, fräs 1 min.","Rör ner kryddorna, fräs 30 sek. Tillsätt potatis och blomkål.","Blanda väl, täck och stek på medelvärme 15 min tills allt är mört.","Toppa med färsk koriander. Servera som tillbehör eller med ris."]},
  "Saag aloo":{servings:4,ingredients:[["Potatis","600 g"],["Babyspenat","300 g"],["Gul lök","2 st"],["Vitlök","3 klyftor"],["Ingefära","1 msk riven"],["Spiskummin","1 tsk"],["Gurkmeja","½ tsk"],["Garam masala","½ tsk"],["Rapsolja","2 msk"],["Salt","efter smak"]],steps:["Tärna och koka potatisen halvmjuk, ca 8 min. Avrina.","Fräs hackad lök i olja tills gyllenbrun. Tillsätt vitlök, ingefära och kryddor, fräs 1 min.","Lägg i potatis, rör om och stek 5 min tills lite knaprig.","Tillsätt spenat och rör tills ihopfalld. Smaka av med salt."]},
  "Lamb rogan josh":{servings:4,ingredients:[["Lammbog (tärnad)","700 g"],["Gul lök","2 st"],["Vitlök","5 klyftor"],["Ingefära","2 msk riven"],["Yoghurt","1,5 dl"],["Krossade tomater","200 g"],["Kashmiri chili","1 msk"],["Spiskummin (hel)","1 tsk"],["Koriander, mald","2 tsk"],["Kanel","1 st"],["Kardemumma","3 kapslar"],["Ghee eller olja","2 msk"],["Salt","efter smak"],["Ris","till servering"]],steps:["Bryn lammet i omgångar i ghee, ta ur. Fräs hel kanel och kardemumma 30 sek.","Fräs hackad lök tills gyllenbrun, ca 10 min. Tillsätt vitlök och ingefära, fräs 2 min.","Rör ner mald koriander och kashmiri-chili, fräs 1 min.","Lägg tillbaka lammet, tillsätt yoghurt lite i taget. Rör ner tomater.","Sjud under lock 1 h tills lammet är mört. Servera med ris."]},
  "Korma med kyckling":{servings:4,ingredients:[["Kycklinglår","700 g"],["Gul lök","2 st"],["Vitlök","3 klyftor"],["Ingefära","1 msk"],["Skalade mandlar","60 g"],["Kokosmjölk","200 ml"],["Grädde","1 dl"],["Safran","½ tsk"],["Kardemumma","4 kapslar"],["Kanel","1 st"],["Koriander, mald","1 tsk"],["Ghee","2 msk"],["Salt","efter smak"],["Ris","till servering"]],steps:["Blötlägg saffran i 2 msk varm mjölk. Mixa mandlar med lite vatten till pasta.","Fräs hel kanel och kardemumma i ghee 30 sek. Tillsätt hackad lök tills gyllenbrun.","Lägg i vitlök, ingefära och mandelpasta, fräs 2 min. Tillsätt malen koriander.","Lägg i kyckling, rör om. Häll i kokosmjölk, grädde och saffransmjölk.","Sjud under lock 25 min. Smaka av med salt. Servera med ris."]},
  "Pad thai med räkor":{servings:4,ingredients:[["Risnudlar (medium)","300 g"],["Räkor (skalade)","300 g"],["Ägg","3 st"],["Böngroddar","150 g"],["Salladslök","4 st"],["Vitlök","3 klyftor"],["Tamarindpasta","3 msk"],["Fisksås","2 msk"],["Palmsocker","1 msk"],["Rostad rapsolja","2 msk"],["Jordnötter (rostade)","60 g"],["Lime","2 st"],["Torkad chili","till servering"]],steps:["Blötlägg nudlar i varmt vatten 20 min, avrina. Blanda tamarind, fisksås och socker.","Woka räkor i olja 2 min, ta ur. Fräs hackad vitlök 30 sek.","Tillsätt nudlar och sås, rör kraftigt 2 min.","Skjut åt sidan, scramble-fräs äggen, blanda med nudlar.","Tillsätt räkor, böngroddar och salladslök. Toppa med jordnötter, lime och chili."]},
  "Thai röd curry med kyckling":{servings:4,ingredients:[["Kycklinglår (tärnat)","600 g"],["Kokosmjölk","400 ml"],["Röd currypasta","3 msk"],["Bambuskott (burk)","200 g"],["Röd paprika","1 st"],["Fisksås","2 msk"],["Palmsocker","1 tsk"],["Lime","1 st"],["Thaibasilikum","1 kruka"],["Kokosolja","1 msk"],["Jasminris","till servering"]],steps:["Fräs currypastan i kokosolja 1 min. Häll i hälften av kokosmjölken, koka 2 min.","Tillsätt kyckling, rör om och stek 5 min.","Häll i resterande kokosmjölk, bambuskott och paprika. Sjud 10 min.","Smaka av med fisksås, socker och lime. Rör ner thaibasilikum.","Servera med jasminris."]},
  "Tom yum soppa":{servings:4,ingredients:[["Räkor (oskalade)","400 g"],["Champinjoner","200 g"],["Citrongräs","2 stjälkar"],["Galangal eller ingefära","3 skivor"],["Kaffirlimeblad","4 st"],["Röd chili","2 st"],["Fisksås","3 msk"],["Lime","2 st"],["Kycklingbuljongtärning","1 st"],["Koriander","till servering"]],steps:["Koka 1,2 l vatten med buljongtärning, citrongräs (krossat), galangal och limeblad, 10 min.","Sila bort aromater. Tillsätt champinjoner och chili, sjud 3 min.","Lägg i räkor, sjud tills rosa, ca 2 min.","Smaka av med fisksås och limejuice. Servera toppat med koriander."]},
  "Mango sticky rice":{servings:4,ingredients:[["Glutinöst ris","300 g"],["Kokosmjölk","400 ml"],["Socker","3 msk"],["Salt","½ tsk"],["Mango (mogen)","2 st"],["Rostade sesamfrön","1 msk"]],steps:["Blötlägg riset 4–8 h. Ånga i 25 min tills genomkokt.","Koka upp 300 ml kokosmjölk med socker och salt. Häll över det ångade riset, rör om. Täck och låt absorbera 20 min.","Koka 100 ml kokosmjölk med lite socker och salt till topping-sås.","Skala och skiva mangon.","Forma ris, lägg mango bredvid. Ringla kokossås och strö sesamfrön."]},
  "Mapo tofu":{servings:4,ingredients:[["Silkestofu","400 g"],["Nötfärs","200 g"],["Doubanjiang","2 msk"],["Fermenterade svarta bönor","1 msk"],["Vitlök","4 klyftor"],["Ingefära","1 msk"],["Sichuan-peppar (mald)","½ tsk"],["Kycklingbuljong","2 dl"],["Soja","1 msk"],["Sesamolja","1 tsk"],["Salladslök","3 st"],["Rapsolja","2 msk"],["Majsstärkelse","1 msk"]],steps:["Tärna tofu, koka försiktigt i saltat vatten 2 min. Avrina.","Fräs köttfärsen i olja tills brynt. Tillsätt doubanjiang och svarta bönor, fräs 1 min.","Tillsätt vitlök och ingefära, fräs 30 sek. Häll i buljong och soja.","Lägg försiktigt ner tofun. Sjud 4 min. Red av med majsstärkelse löst i lite vatten.","Toppa med Sichuan-peppar, salladslök och sesamolja."]},
  "Kung pao kyckling":{servings:4,ingredients:[["Kycklingfilé","600 g"],["Torkad röd chili","8 st"],["Sichuan-peppar","1 tsk"],["Jordnötter (rostade)","80 g"],["Vitlök","3 klyftor"],["Ingefära","1 msk"],["Salladslök","4 st"],["Soja","2 msk"],["Svart vinäger","1 msk"],["Socker","1 tsk"],["Majsstärkelse","1 msk"],["Sesamolja","1 tsk"],["Rapsolja","2 msk"]],steps:["Tärna kycklingen, marinera i soja, stärkelse och lite olja, 15 min.","Blanda soja, vinäger, socker och stärkelse till sås.","Woka chili och Sichuan-peppar i het olja 30 sek. Tillsätt kyckling, woka 4 min.","Tillsätt vitlök och ingefära, woka 1 min. Häll i sås, rör till glansig.","Lägg i jordnötter och salladslök. Ringla sesamolja."]},
  "Wonton-soppa":{servings:4,ingredients:[["Wonton-skal","24 st"],["Fläskfärs","200 g"],["Räkor (skalade, hackade)","100 g"],["Ingefära","1 msk riven"],["Salladslök","3 st"],["Soja","1 msk"],["Sesamolja","1 tsk"],["Kycklingbuljong","1,5 l"],["Pak choi","2 st"],["Salt & vitpeppar","efter smak"]],steps:["Blanda fläskfärs, räkor, ingefära, hackad salladslök, soja och sesamolja till fyllning.","Lägg 1 tsk fyllning i varje wonton-skal, fukta kanterna och vik till trianguler eller säckform.","Koka wontons i vatten 4–5 min tills de flyter. Ta upp.","Koka buljong, smaka av. Koka pak choi 2 min.","Servera wontons i buljong med pak choi."]},
  "Stekt ris med ägg och grönsaker":{servings:4,ingredients:[["Dag-gammalt jasminris","600 g (kokt)"],["Ägg","4 st"],["Majs (burk)","1 x 200 g"],["Frysta ärtor","150 g"],["Salladslök","4 st"],["Vitlök","3 klyftor"],["Soja","3 msk"],["Sesamolja","1 tsk"],["Rapsolja","2 msk"],["Vitpeppar","½ tsk"]],steps:["Värm wok på hög värme tills rykande het. Tillsätt olja.","Fräs vitlök 30 sek. Tillsätt riset, rör och tryck mot botten 3 min tills lite knaprig.","Skjut riset åt sidan, scramble-fräs äggen.","Blanda ägg och ris. Tillsätt majs, ärtor och soja, woka 2 min.","Toppa med salladslök, vitpeppar och sesamolja."]},
  "Hoisin-fläsk med nudlar":{servings:4,ingredients:[["Fläskkarré","600 g"],["Hoisinsås","4 msk"],["Soja","2 msk"],["Sesamolja","1 msk"],["Vitlök","3 klyftor"],["Ingefära","1 msk"],["Äppelcidervinäger","1 msk"],["Udon- eller ramen-nudlar","400 g"],["Gurka (inlagd eller färsk)","1 st"],["Salladslök","3 st"],["Sesamfrön","1 msk"]],steps:["Blanda hoisin, soja, sesamolja, vitlök, ingefära och vinäger till marinad.","Marinera fläsket minst 1 h. Rosta i ugn 180°C i 2 h tills mört, pensla med marinad varannan halvtimme.","Koka nudlar enligt förpackning.","Strimla fläsket. Skiva gurkan tunt.","Servera fläsk på nudlar med gurka, salladslök och sesamfrön."]},
  "Gyudon (nötköttsris)":{servings:4,ingredients:[["Tunt skivat nötkött (entrecôte/innanlår)","500 g"],["Gul lök","3 st"],["Dashi (granulat)","1 msk"],["Mirin","3 msk"],["Sake","2 msk"],["Soja","3 msk"],["Socker","1 tsk"],["Ångat japanskt ris","till servering"],["Beni shoga (inlagd ingefära)","till servering"],["Ägg","4 st (halvkokta, valfritt)"]],steps:["Koka dashi, mirin, sake, soja och socker. Tillsätt skivelad lök, sjud 8 min.","Lägg i nötköttet i tunna lager, sjud 3–4 min tills precis genomvarm.","Halvkoka äggen om önskat: 7 min i kokande vatten, kyl snabbt.","Lägg ris i skål, toppa med kött och lök och lite av buljongen.","Garnera med beni shoga och halverat ägg."]},
  "Tonkotsu ramen":{servings:4,ingredients:[["Färska ramen-nudlar","400 g"],["Fläskben och revbensspjäll","1 kg"],["Gul lök","2 st"],["Vitlök","1 huvud"],["Ingefära","5 cm"],["Soja (tare)","4 msk"],["Mirin","2 msk"],["Ägg","4 st"],["Chashu-fläsk (se steg)","valfritt"],["Nori","4 blad"],["Salladslök","till servering"],["Bambuskott","till servering"]],steps:["Koka fläskbenen i vatten 5 min, skölj. Koka med lök, vitlök och ingefära i 10–12 h på låg värme.","Sila buljongen, smaka av med salt. Blanda soja och mirin till tare.","Sjud äggen 7 min, kyl i isvatten, skala.","Marinera äggen i soja, mirin och vatten 1 h.","Värm buljong, häll i skålar med 1 msk tare per skål. Lägg i nudlar och toppings."]},
  "Miso-soppa med tofu och wakame":{servings:4,ingredients:[["Vit eller röd misopasta","3 msk"],["Silkestofu","200 g"],["Torkad wakame","1 msk"],["Dashi (granulat)","1 msk"],["Salladslök","3 st"],["Vatten","1 l"]],steps:["Koka upp vatten med dashi. Dra av värmen.","Blötlägg wakame 5 min, pressa ur vatten.","Tärna tofu, lägg försiktigt i soppan.","Lös misopasta i lite varm soppa, häll tillbaka. Koka INTE upp igen.","Servera med wakame och skivad salladslök."]},
  "Teriyaki-lax":{servings:4,ingredients:[["Laxfilé","4 st (ca 150 g/st)"],["Soja","3 msk"],["Mirin","3 msk"],["Sake","2 msk"],["Socker","1 msk"],["Sesamolja","1 tsk"],["Sesamfrön","1 msk"],["Ångat japanskt ris","till servering"],["Edamame","150 g"],["Inlagd gurka","till servering"]],steps:["Blanda soja, mirin, sake och socker till teriyakisås. Marinera laxen 15 min.","Stek laxen i sesamolja 3 min per sida tills genomvarm.","Tillsätt sås i pannan, pensla och glacera 1–2 min tills glansig.","Anga eller koka edamame.","Servera lax på ris med edamame och inlagd gurka. Strö sesamfrön."]},
  "Oyakodon":{servings:4,ingredients:[["Kycklinglår (utur ben, tärnat)","500 g"],["Ägg","6 st"],["Gul lök","2 st"],["Dashi","3 dl"],["Soja","3 msk"],["Mirin","2 msk"],["Socker","1 tsk"],["Japanskt ris","till servering"],["Mitsuba eller salladslök","till servering"]],steps:["Koka dashi, soja, mirin och socker. Tillsätt skivelad lök, sjud 3 min.","Lägg i kyckling, sjud under lock 5–6 min.","Vispa äggen löst (inte för enhetliga). Häll hälften ovanpå kycklingen.","Lägg lock och sjud 1 min. Häll i resten av äggen, sjud 30 sek till halvflytande.","Lägg på ris och garnera med mitsuba."]},
  "Katsu curry":{servings:4,ingredients:[["Kycklingbröst","4 st"],["Panko-ströbröd","150 g"],["Ägg","2 st"],["Vetemjöl","3 msk"],["Japansk curry-roux (S&B)","4 portioner"],["Gul lök","2 st"],["Morot","1 st"],["Potatis","2 st"],["Kycklingbuljong","6 dl"],["Rapsolja","till fritering"],["Japanskt ris","till servering"]],steps:["Koka lök, morot och potatis i buljong 15 min. Tillsätt curry-roux, rör tills slät. Sjud 5 min.","Platta ut kycklingen, salta. Panera i mjöl, ägg och panko.","Fritera i 170°C olja tills gyllenbrun och genomvarm, ca 5–6 min.","Skiva kycklingen snett.","Lägg ris i skål, häll curry bredvid och lägg kycklingskivorna ovanpå."]},
  "Bibimbap":{servings:4,ingredients:[["Japanskt ris","400 g (kokt)"],["Nötfärs","300 g"],["Soja","2 msk"],["Sesamolja","2 msk"],["Vitlök","3 klyftor"],["Morot (strimlad)","2 st"],["Zucchini (strimlad)","1 st"],["Babyspenat","100 g"],["Böngroddar","100 g"],["Ägg","4 st"],["Gochujang","till servering"],["Sesamfrön","till servering"]],steps:["Bryn köttfärsen med soja, sesamolja och vitlök. Salta.","Woka varje grönsak separat i sesamolja med vitlök, salta. Håll varm.","Stek äggen med rinnig gula.","Fördela ris i skålar. Arrangera grönsaker och kött radiellt ovanpå.","Lägg ett ägg i mitten. Lägg gochujang vid sidan, strö sesamfrön. Blanda allt vid bordet."]},
  "Kimchi-jjigae":{servings:4,ingredients:[["Fermenterad kimchi","300 g"],["Fläskkarré (tärnad)","300 g"],["Silkestofu","300 g"],["Gochugaru","1 msk"],["Vitlök","3 klyftor"],["Salladslök","3 st"],["Sesamolja","1 tsk"],["Fläsk- eller kycklingbuljong","5 dl"],["Soja","1 msk"],["Salt","efter smak"]],steps:["Fräs fläsk i sesamolja 3 min. Tillsätt kimchi och gochugaru, fräs 2 min.","Häll i buljong, soja och vitlök. Koka upp.","Tillsätt tärnad tofu, sjud 10 min.","Smaka av med salt. Toppa med salladslök.","Servera med ris."]},
  "Bulgogi":{servings:4,ingredients:[["Tunt skivat nötkött (entrecôte)","600 g"],["Asiatiskt päron eller äpple","½ st (riven)"],["Soja","4 msk"],["Sesamolja","2 msk"],["Socker","1 msk"],["Vitlök","4 klyftor"],["Ingefära","1 msk"],["Salladslök","3 st"],["Sesamfrön","1 msk"],["Ris eller salladsblad","till servering"]],steps:["Riv lök, vitlök och ingefära. Blanda med soja, sesamolja, socker och päron till marinad.","Marinera nötköttet minst 30 min, gärna över natten.","Grilla eller stek i het panna i omgångar, ca 2 min per sida.","Strö sesamfrön och salladslök.","Servera med ris eller inlindat i salladsblad med gochujang."]},
  "Japchae":{servings:4,ingredients:[["Koreanska glasnudlar (dangmyeon)","200 g"],["Nötkött (strimlat)","200 g"],["Spenat","150 g"],["Morot (strimlad)","1 st"],["Gul lök (strimlad)","1 st"],["Torkad shiitake","5 st"],["Soja","3 msk"],["Sesamolja","2 msk"],["Socker","1 msk"],["Vitlök","2 klyftor"],["Sesamfrön","1 msk"],["Ägg","1 st (valfritt)"]],steps:["Blötlägg shiitake och nudlar separat i varmt vatten 20 min. Koka nudlar 5 min, avrina.","Marinera nötkött i soja, sesamolja och socker, 15 min. Stek 3 min.","Woka morot, lök och shiitake var för sig med lite soja och sesamolja.","Blanchera spenat, pressa ur vatten, blanda med soja och sesamolja.","Blanda nudlar med kött, grönsaker och resterande soja. Toppa med sesamfrön."]},
  "Pho bo":{servings:4,ingredients:[["Oxben/oxtail","1 kg"],["Lökhalvor (grillade)","2 st"],["Ingefära (grillad)","5 cm"],["Stjärnanis","3 st"],["Kanel","1 st"],["Kardemumma","3 st"],["Soja","2 msk"],["Fisksås","3 msk"],["Risnudlar (tunna)","400 g"],["Tunt skivat nötkött","300 g"],["Böngroddar, thaibasilikum, lime","till servering"],["Chilisås och hoisin","till servering"]],steps:["Koka benen i vatten 5 min, skölj. Grilla lökhavorna och ingefäran under grillelem 5 min.","Koka benen med lök, ingefära och kryddor i 6–8 h. Sila, smaka av med fisksås och soja.","Blötlägg nudlarna 30 min, koka 30 sek. Fördela i skålar.","Lägg råskivet nötkött ovanpå nudlarna. Häll het buljong ovanpå (kokar köttet).","Servera med böngroddar, basilika, lime och såser vid sidan."]},
  "Bún bò Huế":{servings:4,ingredients:[["Fläskben","500 g"],["Citrongräs","3 stjälkar"],["Räkpasta (mắm ruốc)","1 msk"],["Gochugaru eller chilipasta","2 msk"],["Fisksås","3 msk"],["Socker","1 tsk"],["Tjocka risnudlar","400 g"],["Salladslök, koriander, lime","till servering"],["Inlagd kål","till servering"]],steps:["Koka fläskbenen med citrongräs (krossat) och salt i 1,5 h. Sila, spara buljong.","Fräs räkpasta och chilipasta i olja 1 min. Häll i buljongen.","Smaka av med fisksås och socker. Sjud 10 min.","Koka nudlar, skölj i kallt vatten. Fördela i skålar.","Häll varm buljong, lägg fläsk och toppa med örter, lök och lime."]},
  "Goi cuon (vårrullar)":{servings:4,ingredients:[["Rispapper (22 cm)","16 blad"],["Räkor (skalade, kokta)","250 g"],["Risnudlar (tunna)","100 g"],["Sallad (romansallat)","8 blad"],["Mynta","1 kruka"],["Morot (julienned)","1 st"],["Gurka (strimlad)","½ st"],["Jordnötssås: jordnötssmör","3 msk"],["Hoisin","2 msk"],["Lime","1 st"],["Vatten","2 msk"]],steps:["Koka nudlar, skölj i kallt vatten. Blanda jordnötssmör, hoisin, limejuice och vatten till sås.","Halvera räkorna längs med.","Blötlägg ett rispapper 10 sek, lägg på fuktig bräda.","Lägg sallad, nudlar, morot, gurka och mynta i nedre tredjedelen. Rulla ett varv, lägg räkorna med rosa sidan ned, fortsätt rulla tight.","Servera med jordnötssåsen."]},
  "Shakshuka":{servings:4,ingredients:[["Ägg","6 st"],["Krossade tomater","800 g"],["Röd paprika","2 st"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Spiskummin","1,5 tsk"],["Koriander, mald","1 tsk"],["Paprikapulver, rökt","1 tsk"],["Cayennepeppar","¼ tsk"],["Olivolja","2 msk"],["Fetaost","100 g"],["Persilja eller koriander","till servering"],["Pitabröd","till servering"]],steps:["Hacka lök och paprika. Fräs i olivolja 7–8 min tills mjukt.","Tillsätt vitlök och alla kryddor, fräs 1 min. Häll i tomater, sjud 15 min.","Smaka av med salt. Gör 6 gropar, knäck ett ägg i varje.","Lägg lock, pochera på låg värme 6–8 min tills vita är stelnade men gulan rinnig.","Smula fetaost, strö örter. Servera med pitabröd."]},
  "Falafel med hummus och pitabröd":{servings:4,ingredients:[["Torkade kikärter","300 g (blötlagda)"],["Persilja","1 kruka"],["Koriander","½ kruka"],["Gul lök","1 st"],["Vitlök","3 klyftor"],["Spiskummin","1,5 tsk"],["Koriander, mald","1 tsk"],["Bakpulver","½ tsk"],["Rapsolja","till fritering"],["Hummus (burk eller hemgjord)","300 g"],["Pitabröd","4 st"],["Inlagd kål och tomatcsallad","till servering"]],steps:["Mixa blötlagda (EJ kokta) kikärter med lök, vitlök, örter och kryddor. Salta. Tillsätt bakpulver.","Forma till 20 biffar, ca 3 cm diameter. Kyl 30 min.","Fritera i 180°C olja tills djupt gyllenbrun, ca 3 min per sida.","Eller: Pensla med olja, ugnsrosta 200°C, 20 min.","Värm pitabröd, fyll med falafel, hummus, sallad och inlagd kål."]},
  "Köfte med bulgur och yoghurtsås":{servings:4,ingredients:[["Lammfärs","500 g"],["Gul lök (riven)","1 st"],["Vitlök","2 klyftor"],["Spiskummin","1 tsk"],["Koriander, mald","1 tsk"],["Paprikapulver","1 tsk"],["Kanel","¼ tsk"],["Salt & peppar","efter smak"],["Bulgur","200 g"],["Kycklingbuljong","4 dl"],["Krossade tomater","200 g"],["Yoghurt (10%)","300 g"],["Citron","1 st"],["Mynta","till servering"]],steps:["Blanda lammfärs med riven lök, vitlök och alla kryddor. Forma till avlånga kotletter.","Grilla eller stek i het panna 3–4 min per sida.","Koka bulgur i buljong med tomater 15 min, smaka av.","Blanda yoghurt med citronsaft och salt.","Servera köfte på bulgur med yoghurtsås och mynta."]},
  "Hummus med ugnsrostade kikärter":{servings:4,ingredients:[["Kikärter (burk)","2 x 400 g"],["Tahini","3 msk"],["Vitlök","2 klyftor"],["Citron","1,5 st"],["Olivolja","3 msk"],["Spiskummin","1 tsk"],["Paprikapulver, rökt","1 tsk"],["Salt","efter smak"],["Pitabröd","till servering"]],steps:["Avrina kikärterna, spara vätskan. Dela av ¼ för rostning.","Mixa resten med tahini, vitlök, citronsaft, olivolja och salt tills helt slät. Späd med kikärtsvatten för önskad konsistens.","Blanda de reserverade kikärterna med olivolja, paprikapulver och salt. Rosta i 200°C, 25 min tills knapriga.","Lägg hummusen i skål, gör en grop. Häll i olivolja, lägg rostade kikärter ovanpå. Strö spiskummin.","Servera med pitabröd."]},
  "Mujaddara":{servings:4,ingredients:[["Gröna eller bruna linser","200 g"],["Bulgur eller ris","200 g"],["Gul lök","4 st"],["Olivolja","4 msk"],["Spiskummin","1,5 tsk"],["Kanel","½ tsk"],["Salt & peppar","efter smak"],["Yoghurt","till servering"]],steps:["Koka linser i saltat vatten 20 min. Avrina.","Skiva lökarna tunt. Fräs i olivolja på medel-låg värme i 30–40 min tills djupt karamelliserade.","Ta av hälften av löken. Tillsätt spiskummin och kanel, fräs 1 min.","Tillsätt bulgur och linserna, häll i vatten (bulgurmängden × 1,5). Koka under lock 15 min.","Toppa med karamelliserad lök och servera med yoghurt."]},
  "Khoresh ghormeh sabzi":{servings:4,ingredients:[["Lammkött (tärnat)","600 g"],["Kidneybönor (blötlagda)","200 g"],["Spenat","200 g"],["Persilja","1 kruka"],["Gräslök","½ kruka"],["Bockhornsklöver, torkad","2 msk"],["Torkad persisk lime (limoo amani)","3 st"],["Gul lök","2 st"],["Gurkmeja","1 tsk"],["Olivolja","3 msk"],["Salt & peppar","efter smak"],["Ris","till servering"]],steps:["Fräs hackad lök tills gyllenbrun. Bryn lammet, tillsätt gurkmeja.","Hacka och fräs spenat, persilja och gräslök separat tills mörkgrönt, ca 15 min.","Tillsätt örtfräset till köttet. Pierca limeklyftorna, lägg i.","Häll i kokta bönor och lite vatten. Sjud under lock 1,5 h.","Smaka av, ta ut limefrukterna. Servera med persiskt ris."]},
  "Moussaka":{servings:6,ingredients:[["Aubergine","3 st"],["Lammfärs","600 g"],["Krossade tomater","400 g"],["Gul lök","2 st"],["Vitlök","3 klyftor"],["Kanel","½ tsk"],["Oregano","1 tsk"],["Rödvin","1 dl"],["— Bechamel —",""],["Smör","50 g"],["Vetemjöl","3 msk"],["Mjölk","5 dl"],["Muskotnöt","¼ tsk"],["Ägg","2 st"],["Riven ost","80 g"]],steps:["Skiva auberginen, salta och låt stå 20 min. Skölj, torka, pensla med olja. Grilla i ugn 200°C, 20 min.","Bryn lammfärs med lök och vitlök. Tillsätt kanel, oregano, tomat och vin. Sjud 20 min.","Bechamel: smält smör, rör ner mjöl, vispa in mjölk gradvis. Koka tjock, krydda med muskot och salt. Dra av, rör ner ägg och hälften av osten.","Varva aubergine och köttfärs i ugnsform. Häll bechamel ovanpå, strö ost.","Grädda 180°C, 45 min tills gyllenbrun. Låt vila 15 min."]},
  "Spanakopita":{servings:6,ingredients:[["Spenat (fryst)","500 g"],["Fetaost","300 g"],["Ägg","3 st"],["Gul lök","1 st"],["Vitlök","2 klyftor"],["Dill","½ kruka"],["Muskotnöt","¼ tsk"],["Filodeg","250 g (ca 10 ark)"],["Smör (smält)","80 g"],["Salt & peppar","efter smak"]],steps:["Tina och pressa ur all vätska ur spenaten. Finhacka lök och vitlök, fräs mjukt.","Blanda spenat, lök, smulad fetaost, ägg, dill och muskotnöt. Salta och peppra.","Pensla ugnsform med smör. Lägg 5 filoark i botten, pensla varje ark med smör.","Fördela fyllningen jämnt. Vik in eventuella överhängande kanter.","Lägg 5 filoark ovanpå, pensla med smör. Skåra ytan. Grädda 180°C, 40–45 min."]},
  "Harira":{servings:6,ingredients:[["Lamm (tärnat)","400 g"],["Kikärter (blötlagda)","200 g"],["Röda linser","100 g"],["Krossade tomater","400 g"],["Gul lök","2 st"],["Selleri","3 stjälkar"],["Koriander, mald","1 tsk"],["Spiskummin","1 tsk"],["Gurkmeja","½ tsk"],["Kanel","¼ tsk"],["Citronsaft","1 st"],["Persilja & koriander","till servering"],["Citron","till servering"]],steps:["Bryn lamm i olja. Tillsätt hackad lök, selleri och kryddor, fräs 3 min.","Häll i tomater, kikärter, linser och 1,5 l vatten. Koka upp.","Sjud under lock 1 h tills allt är mört.","Smaka av med citronsaft och salt. Justera konsistens.","Servera toppat med hackad persilja, koriander och citronskal."]},
  "Shakshuka med merguez":{servings:4,ingredients:[["Merguez-korvar","300 g"],["Ägg","6 st"],["Krossade tomater","800 g"],["Röd paprika","2 st"],["Gul lök","1 st"],["Vitlök","3 klyftor"],["Harissa","1 msk"],["Spiskummin","1 tsk"],["Paprikapulver, rökt","1 tsk"],["Olivolja","2 msk"],["Persilja","till servering"],["Bröd","till servering"]],steps:["Stek merguez tills brynt, skär i bitar. Ta ur.","Fräs hackad lök och paprika i korvfettet 7 min. Tillsätt vitlök och kryddor.","Häll i tomater och harissa, sjud 12 min. Lägg i korvbitarna.","Gör gropar, knäck äggen. Pochera under lock 7 min.","Toppa med persilja, servera med bröd."]},
  "Chermoula-lax med couscous":{servings:4,ingredients:[["Laxfilé","4 st"],["Koriander","1 kruka"],["Persilja","½ kruka"],["Vitlök","3 klyftor"],["Spiskummin","1 tsk"],["Paprikapulver, rökt","1 tsk"],["Cayenne","¼ tsk"],["Citron","1 st"],["Olivolja","4 msk"],["Couscous","300 g"],["Grönsaksbuljongtärning","1 st"],["Salt","efter smak"]],steps:["Mixa koriander, persilja, vitlök, kryddor, citronsaft och olivolja till chermoula-marinad.","Marinera laxen 30 min. Grilla eller stek 3–4 min per sida.","Häll kokande buljong (1:1) över couscous. Täck 5 min, fluffa med gaffel.","Blanda couscous med lite chermoula och citronskal.","Servera laxen på couscous med resten av cheermoulan."]},
  "Jollof rice med kyckling":{servings:6,ingredients:[["Kycklinglår","800 g"],["Långkornigt ris","400 g"],["Krossade tomater","400 g"],["Röd paprika","2 st"],["Scotch bonnet eller jalapeño","1 st"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Ingefära","1 msk"],["Kyckling-bouillonkuber","2 st"],["Rapsolja","3 msk"],["Spiskummin, koriander, timjan","1 tsk vardera"],["Salt","efter smak"]],steps:["Mixa tomater, paprika och chili till sås. Fräs lök i olja tills gyllenbrun.","Tillsätt vitlök, ingefära och kryddor, fräs 2 min. Häll i tomatsåsen, sjud 20 min.","Bryn kycklingen separat, lägg i formen med såsen.","Tillsätt ris och buljong (ca 1:1,5 ris:vatten). Koka upp, sänk värmen, täck och koka 25 min.","Låt vila 10 min under folie. Rör om och servera."]},
  "Injera med misir wot":{servings:4,ingredients:[["Röda linser","300 g"],["Berbere-kryddblandning","2 msk"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Ingefära","1 msk"],["Krossade tomater","200 g"],["Niter kibbeh (kryddat smör)","3 msk"],["Salt","efter smak"],["Injera (färdigt eller från mix)","till servering"]],steps:["Skölj linserna. Koka med hackad lök, vitlök och lite salt i 25 min.","Bryn hackad lök i niter kibbeh tills djupt gyllenbrun, ca 15 min.","Tillsätt vitlök, ingefära och berbere, fräs 2 min.","Blanda linserna med lökblandningen och tomater. Sjud 15 min.","Servera på injera-bröd, ät med händerna."]},
  "Gallo pinto":{servings:4,ingredients:[["Svarta bönor (kokt eller burk)","400 g"],["Vitt ris (dag-gammalt)","400 g (kokt)"],["Gul lök","1 st"],["Röd paprika","1 st"],["Vitlök","3 klyftor"],["Salsa Lizano (eller worcestershire)","2 msk"],["Spiskummin","1 tsk"],["Rapsolja","2 msk"],["Koriander","½ kruka"],["Salt","efter smak"]],steps:["Hacka lök, paprika och vitlök. Fräs i olja tills mjukt, ca 5 min.","Tillsätt spiskummin och salsa Lizano, fräs 1 min.","Tillsätt bönorna med lite av sin vätska, rör om och sjud 3 min.","Lägg i det kalla riset, blanda väl och stek på medelhög värme tills lite knaprig, ca 5 min.","Toppa med hackad koriander. Servera som frukost eller tillbehör."]},
  "Caldo de res":{servings:6,ingredients:[["Oxsvans eller nötkött","800 g"],["Majskolvar","2 st"],["Zucchini","2 st"],["Potatis","3 st"],["Morot","3 st"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Koriander","1 kruka"],["Kålblad","4 st"],["Salt","efter smak"],["Lime","till servering"],["Oregano","1 tsk"]],steps:["Koka kött med lök, vitlök och salt i 2 h tills mört.","Tillsätt morötter och potatis, koka 15 min.","Tillsätt majskolvar, zucchini och kål, koka 10 min.","Smaka av med salt och oregano.","Servera med koriander och lime."]},
  "Aji de gallina":{servings:4,ingredients:[["Kycklingbröst","600 g"],["Gul ají amarillo-pasta (eller gul chili)","3 msk"],["Vitt bröd","3 skivor"],["Kycklingbuljong","3 dl"],["Valnötter","80 g"],["Parmigiano, riven","50 g"],["Gul lök","2 st"],["Vitlök","3 klyftor"],["Gurkmeja","1 tsk"],["Vegetabilisk olja","2 msk"],["Hårdkokta ägg","2 st"],["Ris","till servering"],["Svarta oliver","till servering"]],steps:["Koka kycklingen i buljong tills genomvarm, ca 20 min. Strimla, spara buljongen.","Blötlägg brödet i buljong, pressa ur. Mixa med valnötter och parmesan.","Fräs hackad lök i olja tills mjuk. Tillsätt vitlök, gurkmeja och ají-pasta, fräs 2 min.","Rör ner brödsmeten och lite buljong tills krämig sås. Lägg i kycklingen, sjud 10 min.","Servera med ris, halverade ägg och oliver."]},
  "Coq au vin":{servings:4,ingredients:[["Kyckling (bit-for-bit)","1,2 kg"],["Rödvin (Bourgogne)","5 dl"],["Rökt bacon","150 g"],["Champinjoner","250 g"],["Pärllök","200 g"],["Vitlök","4 klyftor"],["Tomatpuré","1 msk"],["Timjan och lagerblad","4 kvistar + 2 blad"],["Smör","40 g"],["Olivolja","2 msk"],["Vetemjöl","2 msk"],["Salt & peppar","efter smak"]],steps:["Marinera kycklingen i vin med örter och vitlök, minst 2 h. Ta upp kyckling, sila marinad.","Bryn bacon och pärllök. Ta ur. Bryn kycklingen i smör och olja. Pudra med mjöl.","Häll i marinaden, tomatpuré och lite vatten. Koka upp, sjud under lock 40 min.","Stek champinjonerna separat, tillsätt de sista 10 min.","Smaka av, servera med potatis eller pasta."]},
  "Ratatouille":{servings:4,ingredients:[["Aubergine","1 st"],["Zucchini","2 st"],["Röd paprika","2 st"],["Tomater","3 st"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Olivolja","4 msk"],["Timjan och rosmarin","4 kvistar vardera"],["Basilika","½ kruka"],["Salt & peppar","efter smak"]],steps:["Tärna alla grönsaker, ca 2 cm bitar. Salta auberginen, låt stå 15 min, torka.","Fräs lök och vitlök i olivolja tills mjukt, ca 8 min.","Tillsätt paprika, fräs 5 min. Lägg i aubergine, fräs 5 min.","Tillsätt zucchini, tomat och örter. Sjud under lock 25 min.","Smaka av, toppa med basilika. Servera som tillbehör eller med bröd."]},
  "Bouillabaisse":{servings:4,ingredients:[["Blandad vit fisk","600 g"],["Räkor (oskalade)","300 g"],["Fänkål","1 st"],["Gul lök","2 st"],["Vitlök","4 klyftor"],["Krossade tomater","400 g"],["Saffran","½ tsk"],["Fänkålsfrön","1 tsk"],["Apelsinskal","1 bit"],["Vitt vin","2 dl"],["Olivolja","3 msk"],["Rouille (aioli med saffran)","till servering"],["Bröd","till servering"]],steps:["Blötlägg saffranet i 2 msk varmt vatten. Fräs hackad lök, vitlök och fänkål i olivolja 8 min.","Tillsätt tomater, vin, saffran, apelsinskal och fänkålsfrön. Häll i 1 l vatten.","Koka upp, sjud 20 min. Mixa delvis för tjockare konsistens.","Lägg i fisk och räkor, sjud 5–7 min tills fisken flagar.","Servera med rouille-smord bröd."]},
  "Quiche Lorraine":{servings:6,ingredients:[["Mördegskal (färdigt)","1 st"],["Rökt bacon","200 g"],["Ägg","4 st"],["Grädde","3 dl"],["Gruyère, riven","100 g"],["Gul lök","1 st"],["Muskotnöt","¼ tsk"],["Salt & peppar","efter smak"]],steps:["Förgädda pajskalet i 200°C, 10 min. Sänk till 180°C.","Stek bacon och hackad lök tills gyllenbrun.","Vispa ägg och grädde. Blanda med bacon, lök och hälften av osten. Krydda med muskot.","Häll fyllningen i pajskalet. Strö resterande ost ovanpå.","Grädda 35–40 min tills stelnad och gyllenbrun."]},
  "Boeuf bourguignon":{servings:4,ingredients:[["Nötkött (högrev)","800 g"],["Rödvin (Bourgogne)","4 dl"],["Rökt bacon","150 g"],["Champinjoner","250 g"],["Pärllök","200 g"],["Morot","2 st"],["Vitlök","4 klyftor"],["Tomatpuré","2 msk"],["Mjöl","2 msk"],["Smör","40 g"],["Olivolja","2 msk"],["Timjan, lagerblad","till smakning"],["Salt & peppar","efter smak"]],steps:["Tärna köttet. Marinera med vin, morot och vitlök natten över. Ta upp köttet, sila marinad.","Bryn bacon. Bryn köttet i omgångar i smör och olja, lägg tillbaka bacon.","Pudra med mjöl, rör om. Häll i marinad och tomatpuré. Koka upp.","Ugnskok 160°C, 2,5 h. Tillsätt champinjoner och pärllök de sista 30 min.","Smaka av, servera med kokt potatis eller pasta."]},
  "Paella valenciana":{servings:4,ingredients:[["Kycklinglår","600 g"],["Paellarisotto (Valencia-ris)","300 g"],["Gröna bönor","150 g"],["Tomater","2 st"],["Vitlök","3 klyftor"],["Paprikapulver, rökt","1 tsk"],["Saffran","½ tsk"],["Kycklingbuljong","7 dl"],["Olivolja","3 msk"],["Rosmarin","2 kvistar"],["Salt","efter smak"]],steps:["Bryn kycklingen i olivolja i paellapannan 5 min per sida. Ta ur.","Fräs hackad vitlök och tomat i fettet 5 min. Tillsätt paprikapulver.","Lägg i riset, rör om 2 min. Häll i varm buljong med saffran. Lägg i kyckling och bönor.","Koka utan omrörning på medelvärme 18 min tills riset absorberat all vätska.","Låt vila 5 min. Socarrat (den krispiga bottenlagret) är ett gott tecken!"]},
  "Patatas bravas":{servings:4,ingredients:[["Fast potatis","800 g"],["Olivolja","3 msk"],["Paprikapulver, rökt","1 tsk"],["Salt","efter smak"],["— Aioli —",""],["Majonnäs","4 msk"],["Vitlök","2 klyftor"],["Citronsaft","1 msk"],["— Brava-sås —",""],["Krossade tomater","200 g"],["Paprikapulver, rökt","1 tsk"],["Cayenne","¼ tsk"],["Vinäger","1 tsk"]],steps:["Tärna potatis, ca 3 cm. Blanda med olivolja, salt och paprikapulver. Rosta 220°C, 35 min tills knaprig.","Brava-sås: koka tomater med paprikapulver, cayenne och vinäger i 10 min. Mixa slät.","Aioli: vispa majonnäs med pressad vitlök och citron.","Servera het potatis toppat med brava-sås och aioli."]},
  "Tortilla española":{servings:4,ingredients:[["Potatis","700 g"],["Ägg","6 st"],["Gul lök","2 st"],["Olivolja","1,5 dl"],["Salt","efter smak"]],steps:["Skiva potatis och lök tunt. Koka sakta i olivolja (confiera) på låg värme 25 min tills mjukt.","Avrina, spara oljan. Vispa äggen, blanda med potatis och lök. Salta.","Stek i 2 msk av oljan i liten panna (24 cm), ca 5 min tills kanterna stelnar.","Vänd med en tallrik och glid tillbaka, stek 3 min till.","Servera varm eller i rumstemperatur."]},
  "Gazpacho":{servings:4,ingredients:[["Mogna tomater","800 g"],["Gurka","1 st"],["Röd paprika","1 st"],["Vitlök","2 klyftor"],["Rödlök","¼ st"],["Vitt bröd (utan skorpa)","2 skivor"],["Sherry-vinäger","2 msk"],["Olivolja","3 msk"],["Salt","efter smak"]],steps:["Blötlägg brödet i vatten 5 min, pressa ur.","Grovhacka alla grönsaker. Mixa med bröd, vinäger och olivolja tills helt slät.","Smaka av med salt och vinäger. Tillsätt lite vatten vid behov.","Sila om önskad superslät konsistens.","Kyl minst 2 h. Servera med ett ringel olivolja och hackad gurka och tomat."]},
  "Janssons frestelse":{servings:4,ingredients:[["Mandelpotatis","800 g"],["Ansjovisfilé (burk)","2 x 50 g"],["Gul lök","3 st"],["Grädde","4 dl"],["Ströbröd","2 msk"],["Smör","20 g"],["Vitpeppar","efter smak"]],steps:["Skala och strimla potatisen (julienne, ca 3 mm). Skiva löken fint.","Fräs löken mjuk i smör, ca 8 min. Varva potatis och lök i smord ugnsform.","Lägg ansjovisfilé jämnt fördelade. Häll hälften av grädden.","Strö ströbröd ovanpå. Grädda 200°C i 20 min.","Häll i resterande grädde, sänk till 175°C, grädda ytterligare 25 min."]},
  "Ärtsoppa med fläsk":{servings:4,ingredients:[["Torkade gula ärter","500 g"],["Rimmat fläsk","400 g"],["Gul lök","2 st"],["Timjan","4 kvistar"],["Lagerblad","2 st"],["Salt & vitpeppar","efter smak"],["Senap","till servering"]],steps:["Blötlägg ärterna natten över. Häll av vattnet.","Koka ärterna i 1,5 l vatten. Skumma noggrant i början.","Tillsätt fläsk, hackad lök, timjan och lagerblad. Sjud under lock 1,5–2 h.","Ta upp fläsket, skär i bitar. Ta bort örter. Smaka av med salt och peppar.","Servera soppa med fläskbitar och senap."]},
  "Gravadlax med hovmästarsås":{servings:6,ingredients:[["Laxfilé (med skinn)","600 g"],["Salt","3 msk"],["Socker","2 msk"],["Grovmalen vitpeppar","1 tsk"],["Dill","1 kruka"],["— Hovmästarsås —",""],["Dijonsenap","3 msk"],["Socker","1 msk"],["Ättika","1 msk"],["Rapsolja","1 dl"],["Dill","½ kruka"],["Salt","efter smak"],["Knäckebröd","till servering"]],steps:["Blanda salt, socker och peppar. Strö hälften på botten av en form.","Lägg laxen med skinnet nedåt, täck med dillkvistar och resten av saltblandningen.","Täck med plast och en tyngd. Kyl 36–48 h, vänd varannan dag.","Hovmästarsås: vispa senap, socker och ättika. Tillsätt oljan droppvis tills emulgerad. Rör ner dill.","Skiva laxen tunt snett. Servera med sås och knäckebröd."]},
  "Biff Lindström":{servings:4,ingredients:[["Nötfärs","600 g"],["Inlagd rödbeta","100 g"],["Inlagd gurka (kapris)","2 msk"],["Gul lök","1 st"],["Ägg","1 st"],["Grädde","1 dl"],["Salt & peppar","efter smak"],["Smör","30 g"],["— Gräddsås —",""],["Smör","20 g"],["Mjöl","1 msk"],["Grädde","3 dl"],["Soja","1 msk"]],steps:["Finhacka rödbeta, kapris och lök. Blanda med köttfärs, ägg och grädde. Salta.","Forma till 8 burgare. Stek i smör 3–4 min per sida.","Gräddsås: smält smör, rör ner mjöl. Vispa in grädde och soja. Koka till krämig.","Servera burgarna med potatis och gräddsås.","Garnera med inlagd rödbeta."]},
  "Fiskbullar i dillsås":{servings:4,ingredients:[["Torsk eller sej","600 g"],["Ägg","2 st"],["Potatismjöl","2 msk"],["Grädde","1 dl"],["Gul lök","½ st"],["Salt & vitpeppar","efter smak"],["— Dillsås —",""],["Smör","30 g"],["Vetemjöl","2 msk"],["Fiskbuljong","3 dl"],["Grädde","2 dl"],["Dill","1 kruka"],["Citron","½ st"]],steps:["Mixa fisken slät med ägg, potatismjöl, grädde och riven lök. Salta.","Koka upp saltat vatten. Forma fiskbullar med två skedar, koka 5 min.","Dillsås: smält smör, rör ner mjöl. Vispa in buljong och grädde. Koka tjock.","Rör ner hackad dill och citronsaft. Smaka av.","Servera fiskbullar i sås med kokt potatis."]},
  "Raggmunk med fläsk och lingon":{servings:4,ingredients:[["Mjölig potatis","800 g"],["Ägg","2 st"],["Mjöl","3 msk"],["Mjölk","1 dl"],["Salt","1 tsk"],["Rökt sidfläsk (skivor)","400 g"],["Smör","till stekning"],["Lingonsylt","till servering"]],steps:["Riv potatisen grovt, pressa ur vatten. Blanda med ägg, mjöl, mjölk och salt.","Stek fläsket krispigt, håll varmt.","Hetta upp smör i panna. Lägg i potatissmet, platta till ca 1 cm.","Stek på medel-hög värme 4–5 min per sida tills gyllenbrun och genomvarm.","Servera direkt med fläsk och lingonsylt."]},

// ─── WEEK UTILS ──────────────────────────────────────────────────────────────
function getISOWeek(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=date.getUTCDay()||7;
  date.setUTCDate(date.getUTCDate()+4-day);
  const yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return{week:Math.ceil((((date-yearStart)/86400000)+1)/7),year:date.getUTCFullYear()};
}
function getISOWeeksInYear(year){const d=new Date(Date.UTC(year,11,28));return getISOWeek(d).week;}
function getWeekStart(week,year){
  const jan4=new Date(Date.UTC(year,0,4));
  const day=jan4.getUTCDay()||7;
  const ws=new Date(jan4);
  ws.setUTCDate(jan4.getUTCDate()-day+1+(week-1)*7);
  return ws;
}
function formatWeekLabel(week,year){
  const start=getWeekStart(week,year);
  const end=new Date(start);end.setUTCDate(start.getUTCDate()+6);
  const months=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const todayWY=getISOWeek(new Date());
  let label=`v.${week} · ${start.getUTCDate()} ${months[start.getUTCMonth()]} – ${end.getUTCDate()} ${months[end.getUTCMonth()]}`;
  if(week===todayWY.week&&year===todayWY.year)label+=' (denna vecka)';
  return label;
}

}

// ─── WEEK SCHEDULE ───────────────────────────────────────────────────────────
// Base week = current ISO week (shifted forward 2 from previous implementation)
function getMealsForWeek(week,year){
  const key=`${week}_${year}`;
  const saved=mealsCache[key];
  // Base: current week = schedule index 0
  const baseWY=getISOWeek(new Date());
  const baseDate=getWeekStart(baseWY.week,baseWY.year);
  const thisDate=getWeekStart(week,year);
  const diffWeeks=Math.round((thisDate-baseDate)/(7*86400000));
  const schedules=[
    {big:[0,1],small:[2,3]},
    {big:[4,5],small:[6,7]},
    {big:[8,9],small:[10,11]},
    {big:[12,13],small:[14,15]},
    {big:[16,17],small:[18,0]},
  ];
  const s=schedules[((diffWeeks%5)+5)%5];
  return{
    big:[
      saved&&saved.big&&saved.big[0]?mealPool.find(m=>m.n===saved.big[0])||mealPool[s.big[0]]:mealPool[s.big[0]],
      saved&&saved.big&&saved.big[1]?mealPool.find(m=>m.n===saved.big[1])||mealPool[s.big[1]]:mealPool[s.big[1]],
    ],
    small:[
      saved&&saved.small&&saved.small[0]?mealPool.find(m=>m.n===saved.small[0])||mealPool[s.small[0]]:mealPool[s.small[0]],
      saved&&saved.small&&saved.small[1]?mealPool.find(m=>m.n===saved.small[1])||mealPool[s.small[1]]:mealPool[s.small[1]],
    ]
  };
}

// ─── RENDER MATSEDEL ─────────────────────────────────────────────────────────
function render(){
  document.getElementById('week-label').textContent=formatWeekLabel(currentWeek,currentYear);
  const todayWY2=getISOWeek(new Date());
  const maxW=getISOWeeksInYear(currentYear);
  const nw=currentWeek===maxW?1:currentWeek+1;
  const ny=currentWeek===maxW?currentYear+1:currentYear;
  document.getElementById('btn-current').classList.toggle('active',currentWeek===todayWY2.week&&currentYear===todayWY2.year);
  document.getElementById('btn-next').classList.toggle('active',currentWeek===nw&&currentYear===ny&&!(currentWeek===todayWY2.week&&currentYear===todayWY2.year));
  const meals=getMealsForWeek(currentWeek,currentYear);
  const main=document.getElementById('page-matsedel');
  main.innerHTML=`
    <div class="section-block">
      <p class="section-heading">Stora portioner — matlådor</p>
      <div class="meal-grid">
        ${mealCard(meals.big[0],'big',0)}
        ${mealCard(meals.big[1],'big',1)}
      </div>
    </div>
    <div class="section-block">
      <p class="section-heading">Kvällsrätter</p>
      <div class="meal-grid">
        ${mealCard(meals.small[0],'small',0)}
        ${mealCard(meals.small[1],'small',1)}
      </div>
    </div>`;
}

function avgRating(name){
  const rs=ratingsCache[name];
  if(!rs||!rs.length)return null;
  return(rs.reduce((a,b)=>a+Number(b.betyg),0)/rs.length).toFixed(1);
}

function mealCard(m,typ,pos){
  const avg=avgRating(m.n);
  const portions=getPortions(currentWeek,currentYear,typ,pos);
  const safeN=m.n.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  return`<div class="meal-card${typ==='big'?' big':''}" onclick="openModal('${safeN}','${m.i}','${typ==='big'?'Stor sats':'Kvällsrätt'}')">
    <div class="card-top">
      <div style="flex:1">
        <div class="card-name">${m.n}</div>
        <div class="card-portions" onclick="event.stopPropagation()">
          <span class="portions-label">Portioner:</span>
          <div class="portions-ctrl">
            <button class="portions-btn" onclick="changePortions(event,'${safeN}','${typ}',${pos},-2)">−</button>
            <span class="portions-num" id="pn_${typ}_${pos}">${portions}</span>
            <button class="portions-btn" onclick="changePortions(event,'${safeN}','${typ}',${pos},2)">+</button>
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="card-icon">${m.i}</span>
        ${typ==='big'?'<span class="badge-mat">matlådor</span>':''}
      </div>
    </div>
    <p class="card-desc">${m.d}</p>
    <div class="tags">${m.t.map(t=>`<span class="tag ${tagClass[t]||''}">${t}</span>`).join('')}</div>
    ${avg?`<div class="card-rating">★ ${avg} / 10</div>`:''}
    <p class="card-hint">↗ Visa recept & betygsätt</p>
    <button class="swap-btn" onclick="event.stopPropagation();openSwap('${safeN}','${typ}',${pos})">⇄ Byt</button>
  </div>`;
}

async function changePortions(e,name,typ,pos,delta){
  e.stopPropagation();
  let cur=getPortions(currentWeek,currentYear,typ,pos);
  cur=Math.max(2,cur+delta);
  setPortions(currentWeek,currentYear,typ,pos,cur);
  const el=document.getElementById(`pn_${typ}_${pos}`);
  if(el)el.textContent=cur;
  const key=`${currentWeek}_${currentYear}_${typ}_${pos}`;
  try{await fetch(API,{method:'POST',body:JSON.stringify({action:'savePortions',key,portions:cur})});}catch(e){}
}
